const crg = (name, style = '') => `<svg viewBox="0 0 24 24" aria-hidden="true"${style ? ` style="${style}"` : ''}><g fill="currentColor">${CRG[name]}</g></svg>`;

/* ---------- Chrome for Android ---------- */
function chromeScreen(inner, o = {}) {
  let omni;
  if (o.query) omni = `${crg('search')}<span class="cr-url">${esc(o.query)}</span>`;
  else {
    const [host, ...rest] = (o.url || 'bebeautiful.in').split('/');
    omni = `${crg('tune')}<span class="cr-url">${host}${rest.length ? `<i>/${rest.join('/')}</i>` : ''}</span>`;
  }
  return `<div class="cr">
    <div class="cr-bar"><span class="cr-ic">${crg('home')}</span><div class="cr-omni">${omni}</div><span class="cr-tabs">${o.tabs || 6}</span><span class="cr-ic">${gl('more')}</span></div>
    ${o.load ? '<div class="cr-load"><i></i></div>' : ''}
    <div class="cr-page">${inner}</div>
    ${o.overlay || ''}
  </div>`;
}


/* the embedded Freestand form card */
function fsForm(inner, o = {}) {
  return `<div class="fsf ${o.cls || ''}"${o.rv != null ? rv(o.rv, 'pop') : ''}>
    <div class="fsf-top"><span class="fsf-step">Step ${o.n} of ${o.of || 4} · ${o.step}</span><span class="fsf-dots">${Array.from({ length: o.of || 4 }, (_, k) => k + 1).map(i => `<i class="${i < o.n ? 'd' : i === o.n ? 'c' : ''}"></i>`).join('')}</span></div>
    ${inner}
  </div>`;
}
/* an outlined input; o.at = ms when the typed value appears (animated), o.ph placeholder */
function wField(label, value, o = {}) {
  let v;
  if (!value) v = `<span class="fp">${o.ph || ''}</span>`;
  else if (o.at != null) v = `<span class="fp" data-rvhide="${o.at}">${o.ph || ''}</span><span class="fv"${rv(o.at, 'typein')}>${value}</span>`;
  else v = `<span class="fv">${value}</span>`;
  return `<div class="wf ${o.cls || ''}"><label>${label}</label><div class="wf-in">${o.pre ? `<span class="wf-pre">${o.pre}</span>` : ''}${v}</div>${o.after || ''}</div>`;
}
/* a button that becomes live at o.at (ms) when animating */
function wCta(label, act, o = {}) {
  const cls = o.cls || '';
  if (o.still) return `<div class="wcta ${cls}">${label}</div>`;   // shown behind an overlay: looks the same, not tappable
  if (o.at != null) return `<div class="wcta off ${cls}" data-rvhide="${o.at}">${label}</div><div class="wcta live hint ${cls}" data-act="${act}"${rv(o.at, 'x')}>${label}</div>`;
  return `<div class="wcta ${act ? 'live' : 'off'} ${o.hint === false ? '' : 'hint'} ${cls}"${act ? ` data-act="${act}"` : ''}>${label}</div>`;
}
function otpBoxes(code, o = {}) {
  const d = (code || '').split('');
  return `<div class="otp ${o.ok ? 'ok' : ''}">${Array.from({ length: 6 }, (_, i) => `<span class="${!code && i === 0 && o.focus ? 'cur' : ''}"${o.at != null && d[i] ? rv(o.at + i * 70, 'pop') : ''}>${d[i] || ''}</span>`).join('')}</div>`;
}
/* Gboard numeric keypad with a clipboard suggestion (every key types the code) */
function gboard(o) {
  const keys = [['1'], ['2'], ['3'], ['−', 'fn'], ['4'], ['5'], ['6'], ['␣', 'fn'], ['7'], ['8'], ['9'], [crg('bksp'), 'fn'], [',', 'fn'], ['0'], ['.', 'fn'], [crg('go'), 'go']];
  return `<div class="gb">
    <div class="gb-sug">${o.clip ? `<span class="gb-clip live hint" data-act="${o.act}">${crg('clip')}${o.clip}</span><span class="gb-lbl">From clipboard</span>` : ''}</div>
    <div class="gb-keys">${keys.map(([k, cls = '']) => `<span class="live ${cls}" data-act="${o.act}">${k}</span>`).join('')}</div>
  </div>`;
}
/* WhatsApp heads-up notification over another app */
function waHeadsUp(o, delay) {
  return `<div class="hun wa-n live hint" data-act="${o.act}"${delay != null ? rv(delay, 'x') : ''}>
    <div class="hun-top"><span class="appic wap">${gl('wa')}</span>WhatsApp · now</div>
    <div class="hun-row"><div class="hun-main"><div class="hun-t">BeBeautiful by HUL</div><div class="hun-b">${o.text}</div></div><span class="hun-lg">${bbMark(30)}</span></div>
    <div class="hun-acts"><button class="live" data-act="${o.act}">Reply</button><button class="live" data-act="${o.act}">Mark as read</button></div>
  </div>`;
}
/* option tiles for a web question */
function qTiles(key, opts, def, sel) {
  return opts.map(([v, sub]) => `<div class="qopt ${v === def && !sel ? 'hint' : ''}" data-act="set:${key}=${v}" data-delay="300"><span class="radio ${sel === v ? 'on' : ''}"></span><div>${v}${sub ? `<small>${sub}</small>` : ''}</div></div>`).join('');
}

/* =================================================================
   Brand marks and product art (flat vector, drawn in code)
   ================================================================= */
/* BeBeautiful monogram: generic "bb" roundel in the plum/blush palette */
function bbMark(w = 30) {
  return `<svg viewBox="0 0 40 40" width="${w}" height="${w}" aria-label="BeBeautiful"><circle cx="20" cy="20" r="20" fill="#5B1F52"/><text x="20" y="26.5" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-weight="700" font-size="19" fill="#F6D9D5">bb</text></svg>`;
}
/* HUL workspace badge: plain text mark */
function hulMark(w = 24) {
  return `<svg viewBox="0 0 40 40" width="${w}" height="${w}" aria-label="HUL"><rect width="40" height="40" rx="9" fill="#1f3f95"/><text x="20" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="13" fill="#fff" letter-spacing=".5">HUL</text></svg>`;
}
/* Freestand mark sized for avatars */
const fsMark = (w = 28) => FS_LOGO_MARK.replace('class="mark" style="display:none"', `width="${w}" height="${w}" style="color:#0B2E6E"`);
const svgWrap = (vb, inner, style = '') => `<svg viewBox="${vb}" style="display:block;width:100%;height:auto;${style}" aria-hidden="true">${inner}</svg>`;

/* ---------- the four minis (bottom-centre at cx, by; scale s) ---------- */

   Freestand analytics, as the product shows them:
   Analytics V2 (Overview · Live Analytics · Data Visualisation) and
   MagicFlow WhatsApp analytics. Palette validated with the dataviz
   checks: Freestand blue 700, orange, blue 400, amber (stepped).

const AV = { s1: '#0A49B7', s2: '#e8671b', s3: '#538FF6', s4: '#b87800', crit: '#c8322b', grid: '#e7ebf2', axis: '#8a94a6', ink: '#1f2937' };
const avTip = (title, rows) => esc(`<b>${title}</b>${rows.map(r => `<br>${r}`).join('')}`);

/* deterministic daily series, 4 Aug to 30 Sep 2026 (58 days) */
const AV_DAYS = Array.from({ length: 58 }, (_, i) => { const d = new Date(Date.UTC(2026, 7, 4 + i)); return { d, lbl: `${d.getUTCDate()} ${MON3[d.getUTCMonth()]}` }; });
function avSpread(total, weights) {
  const sum = weights.reduce((a, b) => a + b, 0);
  const out = weights.map(w => Math.floor(total * w / sum));
  let rest = total - out.reduce((a, b) => a + b, 0);
  for (let i = 0; rest > 0; i = (i + 1) % out.length) if (weights[i] > 0) { out[i]++; rest--; }
  return out;
}
const AV_CLAIMS = avSpread(5000, AV_DAYS.map((x, i) => (i > 39 ? 0 : (0.55 + 0.45 * Math.min(1, i / 6)) * (1.18 - i / 90) * ([0, 6].includes(x.d.getUTCDay()) ? 1.22 : 1) * (1 + 0.12 * Math.sin(i * 1.7)))));
const AV_DELIV = avSpread(4318, AV_DAYS.map((_, i) => (i < 1 ? 0 : (AV_CLAIMS[i - 1] || 0) * 0.6 + (AV_CLAIMS[i - 2] || 0) * 0.4)));
const AV_FEED = avSpread(3022, AV_DAYS.map((_, i) => (i < 3 ? 0 : (AV_DELIV[i - 3] || 0))));

/* ---------- combo chart: bars Claims + Deliveries, line Feedbacks (one axis) ---------- */
function avCombo(cumulative) {
  const W = 660, H = 250, L = 44, R = 12, T = 14, B = 30;
  const n = AV_DAYS.length, bw = (W - L - R) / n;
  const cum = a => a.reduce((acc, v, i) => (acc.push((acc[i - 1] || 0) + v), acc), []);
  const C = cumulative ? cum(AV_CLAIMS) : AV_CLAIMS, D = cumulative ? cum(AV_DELIV) : AV_DELIV, F = cumulative ? cum(AV_FEED) : AV_FEED;
  const max = cumulative ? 5000 : 200, step = cumulative ? 1000 : 50;
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = '';
  for (let v = 0; v <= max; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${AV.grid}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="${AV.axis}">${inr(v)}</text>`;
  AV_DAYS.forEach((x, i) => { if (i % 7 === 0) g += `<text x="${L + bw * i + bw / 2}" y="${H - 10}" text-anchor="middle" font-size="10.5" fill="${AV.axis}">${x.lbl}</text>`; });
  let marks = '';
  if (cumulative) {
    const line = (arr, col, w) => `<polyline points="${arr.map((v, i) => `${L + bw * i + bw / 2},${y(v)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
    marks += line(C, AV.s1, 2) + line(D, AV.s3, 2) + line(F, AV.s2, 2);
  } else {
    const hw = Math.max(1.5, (bw - 3) / 2);
    AV_DAYS.forEach((_, i) => {
      const x0 = L + bw * i + 1;
      if (C[i]) marks += `<path d="M${x0} ${y(0)}V${y(C[i]) + 2}q0 -2 2 -2h${hw - 4 > 0 ? hw - 4 : 0}q2 0 2 2V${y(0)}Z" fill="${AV.s1}"/>`;
      if (D[i]) marks += `<path d="M${x0 + hw + 1} ${y(0)}V${y(D[i]) + 2}q0 -2 2 -2h${hw - 4 > 0 ? hw - 4 : 0}q2 0 2 2V${y(0)}Z" fill="${AV.s3}"/>`;
    });
    marks += `<polyline points="${F.map((v, i) => `${L + bw * i + bw / 2},${y(v)}`).join(' ')}" fill="none" stroke="${AV.s2}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  // hover columns: one invisible hit target per day, wider than the marks
  const hits = AV_DAYS.map((x, i) => `<rect x="${L + bw * i}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent" class="av-hit" data-tip="${avTip(`${x.lbl} 2026`, [`Claims ${inr(C[i])}`, `Deliveries ${inr(D[i])}`, `Feedbacks ${inr(F[i])}`])}"/>`).join('');
  return `<svg class="av-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${cumulative ? 'Cumulative' : 'Day wise'} claims, deliveries and feedbacks">${g}${marks}${hits}</svg>`;
}

      <div class="prog"><div class="prog-toggle" role="tablist" aria-label="Chapter">
        <button role="tab" data-jump="0" data-end="5">${ic('megaphone')}<span class="pt-txt">Ad &amp; sign-up</span><span class="pt-sub">Ads × web form × WhatsApp</span></button>
        <button role="tab" data-jump="5" data-end="10">${ic('store')}<span class="pt-txt">Pickup or delivery</span><span class="pt-sub">Store QR × home</span></button>
        <button role="tab" data-jump="10" data-end="15">${ic('award')}<span class="pt-txt">Loyalty &amp; results</span><span class="pt-sub">Bills × HUL wallet</span></button>
      </div></div>
      <div class="tb-right">
        <div class="search" id="search" role="button" tabindex="0">${ic('search')}<span>Search people, stores, boxes…</span><kbd>⌘K</kbd></div>
        <button class="tb-icon" aria-label="Help">${ic('help')}</button>
        <button class="tb-icon" aria-label="Notifications">${ic('bell')}<span class="dot"></span></button>
        <span class="avatar" title="Ananya Rao">AR</span>
      </div>
    </header>
    <nav class="sidebar"><div class="sb-scroll" id="sbScroll"></div>
      <div class="sb-fs"><span>Powered by</span>${FS_LOGO_FULL.replace('class="full"', 'class="fsw-logo"')}</div>
      <div class="sb-foot"><span class="avatar">AR</span><div class="u"><div class="u-n">Ananya Rao</div><div class="u-r">Brand Manager · HUL</div></div>${ic('updown')}</div></nav>
    <main class="main">
      <div class="page-head" id="pageHead"></div>
      <div class="workspace"><section class="stage" id="stage"></section><aside class="cdp" id="cdp" aria-live="polite"></aside></div>
      <footer class="stepbar"><div class="sb-card" id="sbCard"></div>

          <div class="prog-wrap"><div class="prog-lbl" id="progLbl"></div><div class="segs" id="segs"></div></div>
          <span class="kbd-hint"><kbd>←</kbd><kbd>→</kbd></span>
          <button class="nav-btn" id="btnBack">${ic('arrowL')}Back</button>
          <button class="nav-btn next" id="btnNext">Next ${ic('arrowR')}</button>
        </div></footer>
    </main>
  </div>
  <div class="cmdk-bg" id="cmdk"><div class="cmdk"><div class="cmdk-in">${ic('search')}<input id="cmdkIn" placeholder="Jump to a step, page or person…" autocomplete="off" spellcheck="false"><kbd style="background:#f1f4f8;color:var(--muted);border-color:var(--line)">esc</kbd></div><div class="cmdk-l" id="cmdkList"></div></div></div>
  <div class="tip" id="tip"></div>`);
}
(function boot() {
  buildShell();
  renderSidebar();
  bindEvents();
  readHash();
  $$('.prog-toggle button').forEach(bt => bt.classList.toggle('on', bt.dataset.demo === ST.demo));
  render({ stepChange: true, anim: true, dir: 1 });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitAll());
  // a deep link pasted into an open tab (render() itself uses replaceState, which doesn't fire this)
  window.addEventListener('hashchange', () => {
    readHash();
    $$('.prog-toggle button').forEach(bt => bt.classList.toggle('on', bt.dataset.demo === ST.demo));
    render({ stepChange: true, anim: true, dir: 1 });
  });
})();

</script>
</body>
