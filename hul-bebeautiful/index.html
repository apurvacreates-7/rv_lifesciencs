.pin-ok{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:10px;background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d;margin-bottom:14px}
.pin-ok>svg{width:20px;height:20px;color:#16a34a;flex:none}
.pin-ok b{display:block;font-size:13.5px}
.pin-ok span{display:block;font-size:11.8px;color:#3f6b4f}
.wdim{position:absolute;inset:54px 0 0;background:rgba(15,23,42,.45);z-index:7;animation:fadeIn .2s}
.wmodal{position:absolute;left:16px;right:16px;top:190px;z-index:8;background:#fff;border-radius:18px;padding:18px 16px 16px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .35s cubic-bezier(.2,.8,.2,1.1) both;color:#111827}
.wmodal h4{margin:0 0 2px;font-size:17px;color:#5B1F52}
.wmodal .lead{font-size:12.8px;color:#6b7280}
.chk-row{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:13.5px;color:#374151;border-bottom:1px solid #f1f3f6}
.chk-row .sp{width:20px;height:20px;border-radius:50%;border:2.5px solid #dbe3ee;border-top-color:#5B1F52;animation:spin .9s linear infinite;flex:none}
.chk-row .ok{width:20px;height:20px;border-radius:50%;background:#16a34a;color:#fff;display:grid;place-items:center;flex:none}
.chk-row .ok svg{width:14px;height:14px}
/* success */
.ws-ok{padding:22px 18px 6px;text-align:center}
.ws-ok h2{margin:0;font-size:23px;color:#5B1F52;font-weight:800;letter-spacing:-.01em}
.ws-ok p{margin:5px 0 0;font-size:14px;color:#4b5563}
.ws-ord{margin:14px 14px 0;border:1px solid #e5e7eb;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;background:#fff}
.ws-ord img{width:66px;flex:none}
.ws-ord .t{font-size:14px;font-weight:700;color:#111827}
.ws-ord .s{font-size:12px;color:#6b7280;line-height:1.5;margin-top:2px}
.ws-ord .s b{color:#111827}
.ws-wa{margin:12px 14px 0;border-radius:14px;background:#effaf3;padding:12px;display:flex;flex-direction:column;gap:10px}
.ws-wa .r{display:flex;gap:9px;align-items:flex-start;font-size:12.4px;color:#14532d;line-height:1.45}
.ws-wa .r>svg{width:20px;height:20px;color:#1faa53;flex:none;margin-top:1px}
.ws-wa .wcta+.wcta{margin-top:0}
/* club */
.club{min-height:100%;display:flex;flex-direction:column;background:#f5f6fa;font-family:var(--pf);color:#111827}
.club-t{font-size:14.5px;color:#5B1F52;font-weight:800;letter-spacing:-.005em}
.club-card{margin:12px 14px 2px;border-radius:18px;padding:14px 16px 13px;background:linear-gradient(135deg,#5B1F52 0%,#8a3a74 100%);color:#fff;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(91,31,82,.3)}
.club-card::after{content:"";position:absolute;right:-44px;top:-44px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(226,180,106,.38),rgba(226,180,106,0) 70%)}
.club-card .k{font-size:10.5px;font-weight:700;letter-spacing:.2em;color:#E2B46A}
.club-card .n{font-size:20px;font-weight:700;margin-top:8px}
.club-card .m{font-size:11.5px;color:#c7d6f2;margin-top:2px}
.club-pts{margin-top:10px;font-size:12.5px;color:#e2e9f7}
.club-pts b{color:#E2B46A;font-size:15px}
.club-sec{margin:11px 16px 8px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#6b7280}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:0 24px 19px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed #c3cfe2;display:grid;place-items:center;font-size:14px;color:#94a3b8;font-weight:700;background:#fff;position:relative}
.stamp svg{width:26px;height:26px}
.stamp.on{border:0;background:#B8446A;color:#fff;box-shadow:0 4px 10px rgba(184,68,106,.3)}
.stamp.gift{border:2px solid #E2B46A;color:#a8436a;background:#fffbeb}
.stamp small{position:absolute;top:calc(100% + 4px);left:-10px;right:-10px;text-align:center;font-size:9.5px;color:#6b7280;font-weight:600;white-space:nowrap}
.club-next{margin:0 16px 10px;font-size:13px;font-weight:600;color:#5B1F52;text-align:center}
.club-how{margin:0 14px;background:#fff;border-radius:14px;border:1px solid #e5e7eb;padding:4px 12px}
.club-how div{display:flex;gap:9px;align-items:center;padding:8px 0;font-size:12.3px;color:#374151;border-bottom:1px solid #f1f3f6}
.club-how div:last-child{border-bottom:0}
.club-how .ic{width:16px;height:16px;color:#B8446A}
.club-btns{margin:10px 14px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.club-btns .wcta{font-size:14px;gap:6px}
.club-btns .wcta+.wcta{margin-top:0}
/* chemist bill photo */
.bill-ph{height:176px;background:radial-gradient(ellipse at 40% 40%,#8a6a4f,#5b4331);display:grid;place-items:center;overflow:hidden}
.bill{width:152px;background:#fbfaf6;transform:rotate(-5deg);padding:9px 10px 11px;font:8.6px/1.4 'Courier New',ui-monospace,monospace;color:#2f2f2f;box-shadow:0 6px 14px rgba(0,0,0,.4);display:flex;flex-direction:column;text-align:center}
.bill b{font-size:10px;letter-spacing:.04em}
.bill .bl,.bill .bi,.bill .bt{display:flex;justify-content:space-between;gap:6px;text-align:left}
.bill .bl{border-top:1px dashed #9ca3af;border-bottom:1px dashed #9ca3af;margin:4px 0;padding:2px 0}
.bill .bt{border-top:1px dashed #9ca3af;margin-top:4px;padding-top:2px;font-weight:700}
.bill .thx{margin-top:4px}

/* ---------------- Platform cards (demo 3) ---------------- */
.wa-g.sm{width:24px;height:24px;border-radius:50%;background:#25d366;display:grid;place-items:center;flex:none}
.wa-g.sm svg{width:14px;height:14px;color:#fff}
.otp-tls{display:grid;gap:2px}
.otp-tl{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);padding:3px 0}
.otp-tl .d{width:18px;height:18px;border-radius:50%;border:2px solid #cfd8e5;display:grid;place-items:center}
.otp-tl.ok{color:var(--fg);font-weight:500}
.otp-tl.ok .d{background:var(--green);border-color:var(--green);color:#fff}
.otp-tl .d svg{width:11px;height:11px;stroke-width:3}
.otp-tl .ts{font:500 10.5px/1 var(--mono);color:var(--muted-2)}
.idr{display:flex;gap:10px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:10px}
.idr .ii{width:28px;height:28px;border-radius:8px;background:var(--violet-soft);color:var(--violet-ink);display:grid;place-items:center;flex:none}
.idr .ii .ic{width:15px;height:15px}
.idr b{display:block;font-size:12.8px;font-weight:600}
.idr span{display:block;font-size:11px;color:var(--muted)}
.id-merge{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;background:linear-gradient(135deg,#f2ecfe,#eaf0fa);border:1px solid #ddd0fb}
.id-merge>.ic{width:18px;height:18px;color:var(--violet);transform:rotate(90deg);flex:none}
.id-merge b{display:block;font-size:13px}
.id-merge span{display:block;font-size:11px;color:var(--fg-2)}
.elg{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-radius:8px}
.elg .d{width:18px;height:18px;border-radius:50%;border:2px solid #cfd8e5;display:grid;place-items:center;flex:none;margin-top:1px}
.elg.ok .d{background:var(--green);border-color:var(--green);color:#fff}
.elg .d svg{width:11px;height:11px;stroke-width:3}
.elg b{display:block;font-size:12.6px;font-weight:600}
.elg span{display:block;font-size:11.3px;color:var(--muted);line-height:1.35}
.elg:not(.ok) b{color:var(--muted)}
.avn{padding:4px 0}
.av-r{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;border-left:3px solid transparent}
.av-r .ai{width:30px;height:30px;border-radius:8px;background:#f1f4f9;color:var(--fg-2);display:grid;place-items:center}
.av-r .ai .ic{width:16px;height:16px}
.av-t b{display:block;font-size:12.8px;font-weight:600}
.av-t span{display:block;font-size:11.3px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av-s{font-size:11.3px;color:var(--fg-2);font-weight:500;white-space:nowrap}
.av-r.sel{background:var(--primary-soft);border-left-color:var(--primary)}
.av-r.sel .ai{background:var(--primary);color:#fff}
.wt.t-loyalty{background:#fdecf3;color:#be185d}

/* ---------------- Responsive ---------------- */
@media (max-width:1400px){
  .kbd-hint{display:none}
  .prog-wrap{min-width:132px}
  .sb-nav{gap:9px;padding:8px 10px}
  .nav-btn{padding:0 11px}
}
@media (max-width:1320px){
  .prog-toggle button .pt-sub{display:none}
  .search{width:auto}
  .search span{display:none}
}
@media (max-width:1180px){
  :root{--sb-w:64px}
  .tb-brand{padding-left:0;justify-content:center}
  .tb-brand .full{display:none}
  .tb-brand .mark{display:block!important;height:28px}
  .sb-label{font-size:0;padding:4px 0;height:10px;border-top:1px solid var(--navy-line);margin:6px 8px 0}
  .sb-item{justify-content:center;padding:0}
  .sb-item span.lbl,.sb-item .sb-badge,.sb-item .sb-live{display:none}
  .sb-foot .u,.sb-foot>.ic{display:none}
  .search span{display:none}.search{width:auto}
  .ws-sub{display:none}
}
@media (max-width:980px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh}
  .topbar{flex-wrap:wrap;padding:8px;height:auto}
  .tb-brand{border:0;width:auto;padding:0 8px}
  .prog{order:5;flex-basis:100%}
  .app{grid-template-rows:auto 1fr}
  .workspace{grid-template-columns:1fr}
  .stage{height:78vh;min-height:560px}
  .cdp{max-height:70vh}
  .stepbar{grid-template-columns:1fr;position:sticky;bottom:0;z-index:4}
  .an-grid,.lay-hsplit{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .topbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:50px auto;column-gap:8px;padding:0 10px 8px;height:auto}
  .tb-brand{width:auto;border:0;padding:0;height:50px}
  .ws{padding:4px;min-width:0}
  .ws>div{min-width:0}
  .ws-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prog{grid-column:1/-1;grid-row:2;padding:0}
  .prog-toggle{width:100%}
  .prog-toggle button{flex:1 1 0;justify-content:center;padding:0 8px}
  .tb-right .search,.tb-right .tb-icon{display:none}
  .stage{height:auto;min-height:0}
  .lay-phone{padding:6px 0}
  .phone-col{height:auto}
  :root{--sb-w:0px}
  .sidebar{display:none}
  .app{grid-template-columns:1fr}
  .main{padding:10px 12px}
  .ph-title h1{font-size:17px;white-space:normal}
  .ph-r{display:none}
  .prog-toggle button{padding:0 8px;font-size:11.5px}
  .prog-toggle button .pt-txt{max-width:120px;overflow:hidden;text-overflow:ellipsis}
  .lay-phone{grid-template-columns:1fr}
  .lay-phone .side-col{display:none}
  .lay-rule{grid-template-columns:1fr}
  .sb-c{white-space:normal}
  .prog-wrap{min-width:0;flex:1}
  .kbd-hint{display:none}
  .pipe{grid-template-columns:repeat(2,minmax(0,1fr))}
  .order{grid-template-columns:1fr}
  .order .o-l{border-right:0;border-bottom:1px solid var(--line)}
  .tl-h .st span{display:none}
  .kpis{grid-template-columns:1fr 1fr}
  .loc-bar{height:32px;font-size:9.5px;letter-spacing:.14em}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}


/* ================================================================
   HUL · BeBeautiful SmartPick Box: new step components
   (same spacing, radius and type scale as the Celin Gold shell)
   ================================================================ */
.sb-fs{padding:12px 20px 4px;color:#fff;opacity:.92}
.sb-fs .fsw-logo{height:17px;width:auto;display:block}
.sb-fs span{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--side-dim);margin-bottom:5px}
@media (max-width:1180px){.sb-fs{display:none}}

/* phone + scene, side by side */
.lay-phone.duo{grid-template-columns:auto minmax(0,1fr);justify-content:stretch}
.side-col.scene-col{height:100%;overflow:hidden}
.scene-col .scene{flex:1}
.scene-strip .run-strip{border-top:0;background:#fff;border-radius:14px}
.scene-strip .run-strip span{display:inline-flex;align-items:center;gap:6px}
@media (max-width:640px){
  .lay-phone.duo{grid-template-columns:1fr}
  .lay-phone.duo .side-col{display:flex;height:auto}
  .lay-phone.duo .scene{flex:none;height:62vw;min-height:220px}
}

/* scene motion */
.rain{animation:rain .7s linear infinite}
@keyframes rain{from{transform:translate(0,-26px)}to{transform:translate(-4px,26px)}}
.pin-drop{animation:pinDrop .75s cubic-bezier(.3,1.4,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes pinDrop{from{opacity:0;transform:translateY(-240px)}60%{opacity:1}to{opacity:1;transform:none}}
.beam{animation:beam 1.5s ease-in-out both}
@keyframes beam{0%{opacity:0}15%{opacity:.85}85%{opacity:.85}100%{opacity:0}}
.pulse-slow{animation:pring 2.2s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}

/* BeBeautiful website */
.bb{min-height:100%;display:flex;flex-direction:column;background:#fff;font-family:var(--pf);color:#2b1526}
.bb-head{height:50px;flex:none;display:flex;align-items:center;padding:0 6px 0 14px;background:#fff;border-bottom:1px solid #f1e4ea}
.bb-logo{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.bb-logo b{font:italic 700 19px/1 Georgia,'Times New Roman',serif;color:#5B1F52;letter-spacing:-.01em}
.bb-cats{display:flex;gap:16px;padding:9px 14px 0;border-bottom:1px solid #f1e4ea;font-size:12.5px;color:#866f7d;white-space:nowrap;overflow:hidden;flex:none}
.bb-cats span{padding-bottom:8px}
.bb-cats .on{color:#5B1F52;font-weight:700;border-bottom:2.5px solid #C9506F;padding-bottom:6px}
.bb-art{padding:14px 16px 4px}
.bb-k{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:#C9506F}
.bb-art h1{margin:6px 0 8px;font:700 24px/1.12 Georgia,'Times New Roman',serif;color:#3a1234;letter-spacing:-.01em}
.bb-art h2{margin:14px 0 4px;font-size:15px;font-weight:700;color:#3a1234}
.bb-art p{margin:0 0 8px;font-size:13.4px;line-height:1.55;color:#4f3547}
.bb-by{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#866f7d;margin-bottom:11px}
.bb-hero{border-radius:14px;overflow:hidden;margin-bottom:11px}
.bb-hero svg{display:block;width:100%;height:auto}
.bb-mini{display:flex;align-items:center;gap:10px;padding:10px 14px 30px;background:linear-gradient(135deg,#fdf0ec 0%,#f5d5d2 100%);flex:none}
.bb-mini svg{width:62px;height:auto;flex:none}
.bb-mini b{display:block;font-size:15px;color:#5B1F52;font-weight:800}
.bb-mini span{display:block;font-size:11.5px;color:#6d4c62}

/* the FreeStand widget inside the article */
.fsw{margin:6px 12px 10px;border-radius:16px;padding:14px 14px 12px;background:linear-gradient(160deg,#fdf1ee 0%,#f7dcd8 100%);border:1px solid #efc9c5;box-shadow:0 8px 24px rgba(91,31,82,.1);color:#2b1526}
.fsw-tag{display:flex;margin-bottom:8px}
.fsw-tag span{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:11px;background:#5B1F52;color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.04em}
.fsw-tag svg{width:12px;height:12px}
.fsw h3{margin:0 0 4px;font-size:19px;line-height:1.2;font-weight:800;color:#4A1942;letter-spacing:-.01em}
.fsw p{margin:0 0 8px;font-size:12.8px;line-height:1.45;color:#6d4c62}
.fsw-art{margin:0 -4px 10px}
.fsw-art svg{display:block;width:100%;height:auto}
.fsw-pw{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:9px;font-size:10.5px;color:#9a8390}
.fsw-pw svg{height:9px;width:auto;color:#9a8390}

/* delivery preference cards */
.dcard{display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 14px;border:1.5px solid #e2cfc5;border-radius:12px;margin-bottom:9px;font-size:15px;color:#2b1526;position:relative;overflow:hidden;background:#fff;line-height:1.3}
.dcard b{display:block;font-weight:600}
.dcard small{display:block;font-size:11.8px;color:#6b7280;margin-top:2px}
.dcard .dc-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#f8eaf1;color:#5B1F52;flex:none}
.dcard .dc-ic .ic{width:19px;height:19px}
.dcard.off{opacity:.72}
.dcard.live,.dcard[data-act]{cursor:pointer;border-color:#C9506F;background:#fff8f7}
.dcard.hint{animation:qHint 1.6s ease-out infinite}
.dcard .dc-tag{margin-left:auto;align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.06em;color:#fff;background:#C9506F;padding:3px 7px;border-radius:6px;text-transform:uppercase}
.stl{display:grid;gap:7px;margin:8px 0 12px}
.str{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1.5px solid #e5e7eb;border-radius:11px;background:#fff}
.str.on{border-color:#C9506F;background:#fff8f7}
.str b{display:block;font-size:13.5px;font-weight:600;color:#2b1526}
.str small{display:block;font-size:11.3px;color:#6b7280;margin-top:1px}
.str .str-d{margin-left:auto;font-size:11.5px;font-weight:700;color:#5B1F52;white-space:nowrap}
.str .radio{flex:none}

/* FreeStand retailer app */
.ra{flex:1;display:flex;flex-direction:column;min-height:0;background:#f3f5f9;font-family:var(--pf);color:#2b1526;position:relative}
.ra-head{flex:none;background:#0B2E6E;color:#fff;padding:8px 14px 12px}
.ra-top{display:flex;align-items:center;gap:10px}
.ra-top .fs{width:32px;height:32px;border-radius:9px;background:#fff;display:grid;place-items:center;color:#0B2E6E;flex:none}
.ra-top .fs svg{width:20px;height:20px}
.ra-top b{display:block;font-size:15px;font-weight:600;line-height:1.2}
.ra-top span{display:block;font-size:11.3px;color:#c1cce0;line-height:1.3}
.ra-earn{margin-left:auto;text-align:right;font-size:10.5px;color:#c1cce0;white-space:nowrap}
.ra-earn b{display:block;font-size:14px;color:#fff}
.ra-tabs{display:flex;gap:6px;margin-top:11px}
.ra-tabs span{flex:1;text-align:center;font-size:12.5px;font-weight:600;padding:7px 0;border-radius:9px;background:rgba(255,255,255,.1);color:#dbe4f5}
.ra-tabs span.on{background:#fff;color:#0B2E6E}
.ra-body{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.ra-body::-webkit-scrollbar{display:none}
.ra-card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(74,25,66,.08);padding:12px 13px;font-size:13px;line-height:1.45}
.ra-lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9a8390;margin-bottom:8px}
.ra-kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:10px 0 0;font-size:12.3px}
.ra-kv dt{color:#866f7d}
.ra-kv dd{margin:0;font-weight:600;text-align:right}
.ra .wcta{flex:none}
.ra .wcta+.wcta{margin-top:0}
.scanv{position:relative;height:292px;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#6f5c55,#2c2320 76%);flex:none}
.scanv .hand{position:absolute;left:50%;bottom:-40px;width:110px;height:120px;margin-left:-40px;border-radius:50px 50px 0 0;background:#c98b62;transform:rotate(-6deg)}
.cphone{position:absolute;left:50%;top:50%;width:128px;height:220px;margin:-118px 0 0 -64px;border-radius:18px;background:#111;padding:6px;transform:rotate(-5deg);box-shadow:0 14px 28px rgba(0,0,0,.45)}
.cphone .scr{width:100%;height:100%;border-radius:13px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:9.5px;color:#4f3547;text-align:center}
.cphone .scr svg{width:92px;height:92px}
.cphone .scr b{font-size:11.5px;color:#2b1526}
.brk{position:absolute;left:50%;top:50%;width:176px;height:176px;margin:-96px 0 0 -88px}
.brk i{position:absolute;width:30px;height:30px;border:4px solid #fff;border-radius:4px}
.brk i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.brk i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.brk i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.brk i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.scanline{position:absolute;left:14%;right:14%;top:22%;height:3px;border-radius:2px;background:linear-gradient(90deg,rgba(74,222,128,0),#4ade80,rgba(74,222,128,0));box-shadow:0 0 14px 2px rgba(74,222,128,.7);animation:scanY .75s ease-in-out 2 alternate}
@keyframes scanY{from{top:20%}to{top:76%}}
.scan-lbl{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-size:12.5px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.scan-ok{position:absolute;inset:0;background:rgba(22,163,74,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff}
.scan-ok b{font-size:19px;font-weight:700}
.tick{width:64px;height:64px;border-radius:50%;background:#fff;color:#16a34a;display:grid;place-items:center;box-shadow:0 0 0 8px rgba(255,255,255,.25)}
.tick svg{width:38px;height:38px}
.tick.sm{width:38px;height:38px;background:#16a34a;color:#fff;box-shadow:0 0 0 5px #dcfce7;flex:none}
.tick.sm svg{width:22px;height:22px}
.vok{display:flex;gap:11px;align-items:center}
.vok b{display:block;font-size:14px;font-weight:700;color:#14532d}
.vok span{display:block;font-size:11.8px;color:#6b7280}
.xs{display:flex;gap:12px;align-items:center}
.xs-art{width:74px;flex:none}
.xs-art svg{display:block;width:100%;height:auto}
.xs b{display:block;font-size:14px;font-weight:700}
.xs-p{font-size:22px;font-weight:800;color:#0a3578;margin:2px 0 5px}
.xs-note{margin-top:10px;padding-top:9px;border-top:1px solid #f1e4ea;font-size:12px;color:#6d4c62}
.inc{display:flex;align-items:center;gap:9px;background:#fff8e8;color:#7c4a03}
.inc .ic{width:18px;height:18px;color:#b7791f}
.okc{display:flex;align-items:center;gap:9px;background:#f0fdf4;color:#14532d;font-weight:500}
.okc>svg{width:20px;height:20px;color:#16a34a;flex:none}
.bill-c .bc-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.bill-c .bc-h b{font-size:14px}
.bill-c .bc-h span{font-size:11.5px;color:#866f7d}
.bc-r{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed #eadbe3;font-size:12.8px}
.bc-r small{display:block;color:#866f7d;font-size:11px}
.bc-r.t{font-weight:800;font-size:14px;color:#0a3578}

/* WhatsApp media: pickup QR, stamp card, OCR */
.qrm{display:flex;gap:10px;align-items:center;padding:10px;background:#fdf1ee}
.qrm-q{width:96px;height:96px;flex:none;background:#fff;border-radius:8px;padding:5px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.qrm-q svg{width:100%;height:100%;display:block}
.qrm-t{font-size:12.3px;line-height:1.4;color:#4f3547}
.qrm-t b{display:block;font-size:16px;color:#2b1526;letter-spacing:.02em}
.qrm-t em{display:inline-block;margin-top:4px;font-style:normal;font-size:11px;font-weight:700;color:#fff;background:#5B1F52;padding:2px 7px;border-radius:5px}
.bill-ph{position:relative}
.ocr{position:absolute;inset:0;overflow:hidden;background:rgba(74,25,66,.18)}
.ocr::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 70%);animation:shimmer 1s linear infinite}
.ocr::after{content:"";position:absolute;left:8%;right:8%;height:2px;background:#f472b6;box-shadow:0 0 10px 2px rgba(244,114,182,.7);animation:scanY .9s ease-in-out infinite alternate}
.ocr span{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(43,21,38,.8);color:#fff;font-size:11.5px;padding:4px 10px;border-radius:10px;white-space:nowrap}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.stc{padding:12px 12px 10px;background:linear-gradient(135deg,#4A1942,#7d3471);color:#fff}
.stc-h{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#f6d9d5}
.stc-h b{font-size:18px;letter-spacing:0;color:#fff}
.stc-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 4px}
.stc-row div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:8.8px;line-height:1.15;text-align:center;color:#f3dfe9}
.stc-row i{width:34px;height:34px;border-radius:50%;border:2px dashed rgba(255,255,255,.4);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;color:rgba(255,255,255,.6)}
.stc-row i svg{width:18px;height:18px}
.stc-row .on i{border:0;background:#f4a3b4;color:#4A1942}
.stc-row .gift i{border:2px solid #E2B46A;color:#E2B46A}
.stc-f{margin-top:6px;font-size:11.5px;color:#f6d9d5;text-align:center}

/* step 9: the HUL wallet explainer */
.wal-hero{border-radius:var(--r-lg);padding:18px 20px;background:linear-gradient(135deg,#4A1942 0%,#7d3471 62%,#c9506f 100%);color:#fff;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center;box-shadow:var(--sh-2)}
.wal-hero .k{font-size:10.5px;font-weight:700;letter-spacing:.2em;color:#f6d9d5}
.wal-hero h2{margin:6px 0 6px;font-size:26px;line-height:1.15;font-weight:750;letter-spacing:-.02em}
.wal-hero p{margin:0;font-size:13.3px;line-height:1.5;color:#f3dfe9}
.brands{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.brands span{height:26px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);font-size:12px;font-weight:600;display:inline-flex;align-items:center}
.how{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.how div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px;font-size:12px;line-height:1.35;color:#f8e8ef}
.how b{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;color:#f4a3b4;margin-bottom:4px}
.wal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.wal-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lad{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.lad:last-child{border-bottom:0}
.lad .pt{height:30px;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:750;font-size:13.5px}
.lad b{display:block;font-size:13px;font-weight:650}
.lad span{display:block;font-size:11.5px;color:var(--muted)}
.rdm{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.rdm:last-child{border-bottom:0}
.rdm .ii{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);flex:none}
.rdm .ii .ic{width:16px;height:16px}
.rdm b{display:block;font-size:13px;font-weight:650}
.rdm span{display:block;font-size:11.5px;color:var(--muted);line-height:1.4}
.ldg-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;background:#fdf9f6;border-radius:0 0 var(--r-lg) var(--r-lg)}
.ldg-foot b{font-size:15px;color:var(--primary)}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.an-scene{display:flex;height:380px;flex:none}
@media (max-width:980px){.wal-hero,.wal-grid,.wal-grid2{grid-template-columns:1fr}.how{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.kpis.k3{grid-template-columns:1fr 1fr}}

.scene-col .loc-bar{font-size:11.5px;letter-spacing:.22em}
.lay-phone.duo{gap:16px}

/* FreeStand retailer app buttons use the platform blue */
.ra .wcta{background:#0a3578}
.ra .wcta.off{background:#e5e7eb;color:#9ca3af}
.ra .wcta.ghost{background:#fff;color:#0a3578;border:1.5px solid #cfd6e0}
.ra .wcta.live.hint{animation:raHint 1.6s ease-out infinite}
@keyframes raHint{0%{box-shadow:0 0 0 0 rgba(10,53,120,.4)}100%{box-shadow:0 0 0 10px rgba(10,53,120,0)}}

/* landing hero art, delivery options */
.lp-hero .lp-art{position:absolute;right:-2px;bottom:26px;width:124px;transform:rotate(-4deg);filter:drop-shadow(0 8px 10px rgba(91,31,82,.2))}
.dcard.opt{cursor:pointer;border-color:#e2cfc5;background:#fff}
.dcard.opt:hover{border-color:#C9506F}
.dcard .dc-b{display:block;font-weight:700;color:#5B1F52;margin-bottom:1px}

/* Instagram feed ad */
.igf{flex:1;display:flex;flex-direction:column;min-height:0;background:#fff;font-family:var(--pf);color:#0f0f0f}
.igf-top{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #efefef}
.igf-top b{font:italic 700 22px/1 Georgia,'Times New Roman',serif;letter-spacing:-.01em}
.igf-ic{display:flex;gap:16px}
.igf-ic svg,.igf-acts svg{width:24px;height:24px}
.igf-body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.igf-body::-webkit-scrollbar{display:none}
.igf-stories{display:flex;gap:12px;padding:10px 12px;border-bottom:1px solid #efefef;overflow:hidden}
.igf-stories div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#262626;flex:none;width:58px}
.igf-stories i{width:56px;height:56px;border-radius:50%;padding:2.5px;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
.igf-stories i.me{background:#dbdbdb}
.igf-stories i span{display:block;width:100%;height:100%;border-radius:50%;border:2.5px solid #fff;background:#e7d7d2}
.igf-post-h{display:flex;align-items:center;gap:9px;padding:9px 12px}
.igf-av{width:32px;height:32px;border-radius:50%;overflow:hidden;flex:none}
.igf-post-h b{display:block;font-size:13.5px;font-weight:600}
.igf-post-h span{display:block;font-size:11.5px;color:#737373}
.igf-more{margin-left:auto}
.igf-more svg{width:20px;height:20px;transform:rotate(90deg)}
.igf-media svg{display:block;width:100%;height:auto}
.igf-cta{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 12px;background:#0095f6;color:#fff;font-size:14px;font-weight:600;cursor:pointer;position:relative;overflow:hidden}
.igf-cta svg{width:20px;height:20px}
.igf-cta.hint{animation:ctaHint 1.6s ease-out infinite}
.igf-acts{display:flex;gap:16px;padding:10px 12px 4px}
.igf-cap{padding:2px 12px 14px;font-size:13px;line-height:1.45}
.sr-h.hint{animation:linkHint 1.6s ease-out infinite}
.sr-sl div[data-act]{cursor:pointer}

/* ---------------- Freestand analytics (Analytics V2 + MagicFlow) ---------------- */
.workspace.wide{grid-template-columns:minmax(0,1fr)}
.workspace.wide .cdp{display:none}
.av-page{padding:0}
.av2{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:100%;background:#fff;border:1px solid #e5e5e5;border-radius:6px}
.av2-side{border-right:1px solid #e5e5e5;padding:12px 10px;display:flex;flex-direction:column;gap:2px;background:#fafafa;border-radius:6px 0 0 6px}
.av-back{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);padding:2px 6px 8px}
.av-back .ic{width:14px;height:14px}
.av-sg{font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);padding:10px 8px 4px}
.av-si{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:6px;font-size:12.8px;font-weight:500;color:var(--fg-2);white-space:nowrap}
.av-si .ic{width:15px;height:15px;color:var(--muted)}
.av-si[data-act]{cursor:pointer}
.av-si[data-act]:hover{background:#eef2f8}
.av-si.on{background:#e8eefb;color:#052762;font-weight:650}
.av-si.on .ic{color:#052762}
.av-n{margin-left:auto;font-size:10.5px;font-weight:600;background:#eef1f6;border-radius:9px;padding:1px 6px;color:var(--muted)}
.av2-main{min-width:0;padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px}
.av-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.av-vt{display:inline-flex;border:1px solid #e5e5e5;border-radius:8px;padding:2px;font-size:11.5px;font-weight:600;color:var(--muted)}
.av-vt span{padding:4px 9px;border-radius:6px}
.av-vt .on{background:#052762;color:#fff}
.av-sel{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--fg);background:#fff}
.av-sel .ic{width:15px;height:15px;color:var(--muted)}
.av-sel svg:last-child{width:16px;height:16px;color:var(--muted)}

/* =================================================================
   Core: helpers, state, navigation, rendering, CDP panel, step bar
   ================================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const inr = n => Number(n).toLocaleString('en-IN');
const val = (v, c) => (typeof v === 'function' ? v(c) : v);

/* ---------- dates (all IST, stored as plain calendar strings) ---------- */
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3 = MON.map(m => m.slice(0, 3));
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WDL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const pd = d => { const [y, m, x] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, x)); };
const dayDiff = (a, b) => Math.round((pd(a) - pd(b)) / 864e5);
const dLong = d => { const x = pd(d); return `${x.getUTCDate()} ${MON[x.getUTCMonth()]} ${x.getUTCFullYear()}`; };
const dShort = d => { const x = pd(d); return `${WD[x.getUTCDay()]}, ${x.getUTCDate()} ${MON3[x.getUTCMonth()]} ${x.getUTCFullYear()}`; };
function waDate(d, today) {
  const n = dayDiff(today, d);
  if (n === 0) return 'Today';
  if (n === 1) return 'Yesterday';
  if (n > 1 && n < 7) return WDL[pd(d).getUTCDay()];
  return dLong(d);
}

/* ---------- visibility of timeline items ---------- */
const vis = (it, c) => it.s < c.s || (it.s === c.s && it.b <= c.b);
const isNew = (it, c) => c.anim && it.s === c.s && it.b === c.b;
const rv = (ms, cls) => ` data-rv="${Math.round(ms)}"${cls ? ` data-rvc="${cls}"` : ''}`;

/* ---------- scheduler for in-step reveals ---------- */
const Sched = {
  t: [],
  add(fn, ms) { this.t.push(setTimeout(fn, ms)); },
  clear() { this.t.forEach(clearTimeout); this.t = []; }
};

/* ---------- state ---------- */
const ST = {
  demo: 'web',
  pos: { web: { s: 0, b: 0 } },
  ch: { web: {} }
};
const DEMO_ORDER = ['web'];
const nextDemo = d => DEMO_ORDER[(DEMO_ORDER.indexOf(d) + 1) % DEMO_ORDER.length];
const DEMOS = {};     // filled by demo files
const SUBJECTS = {};  // CDP subjects

function ctx(extra = {}) {
  const p = ST.pos[ST.demo];
  const D = DEMOS[ST.demo];
  const store = ST.ch[ST.demo];
  return Object.assign({
    demo: ST.demo, s: p.s, b: p.b, anim: false, dir: 0,
    v: k => (store[k] !== undefined ? store[k] : D.defaults[k]),
    has: k => store[k] !== undefined
  }, extra);
}
const stepOf = (demo, s) => DEMOS[demo].steps[s];
const beatsOf = (step, c) => Math.max(1, val(step.beats || 1, c));

/* ---------- navigation ---------- */
function go(s, b, opts = {}) {
  const p = ST.pos[ST.demo];
  const stepChange = s !== p.s;
  p.s = s; p.b = b;
  render(Object.assign({ stepChange }, opts));
}
function next() {
  const c = ctx();
  const step = stepOf(ST.demo, c.s);
  const nb = beatsOf(step, c);
  if (c.b < nb - 1) return go(c.s, c.b + 1, { anim: true, dir: 1 });
  if (c.s < DEMOS[ST.demo].steps.length - 1) return go(c.s + 1, 0, { anim: true, dir: 1 });
  // end of this demo → hand over to the next programme
  switchDemo(nextDemo(ST.demo), true);
}
function back() {
  const c = ctx();
  if (c.b > 0) return go(c.s, c.b - 1, { anim: false, dir: -1 });
  if (c.s > 0) {
    const prev = stepOf(ST.demo, c.s - 1);
    const pc = ctx({ s: c.s - 1, b: 0 });
    return go(c.s - 1, beatsOf(prev, pc) - 1, { anim: false, dir: -1 });
  }
}
function jump(s, b = 0) { go(s, b, { anim: true, dir: s >= ST.pos[ST.demo].s ? 1 : -1, stepChange: true }); }
function switchDemo(d, fromStart) {
  if (d === ST.demo && !fromStart) return;
  ST.demo = d;
  if (fromStart) ST.pos[d] = { s: 0, b: 0 };
  $$('.prog-toggle button').forEach(bt => bt.classList.toggle('on', bt.dataset.demo === d));
  render({ stepChange: true, anim: true, dir: 1 });
}
function setChoice(k, v) { ST.ch[ST.demo][k] = v; }

/* ---------- actions (phone buttons, scene hotspots, page controls) ---------- */
function doAct(act, el) {
  if (!act) return;
  if (act === 'next') return next();
  if (act === 'back') return back();
  const [kind, rest] = act.split(':');
  if (kind === 'set') {
    const [k, v] = rest.split('=');
    setChoice(k, v);
    const delay = el && el.dataset.delay ? +el.dataset.delay : 0;
    if (delay) { const r = el.querySelector('.radio'); if (r) r.classList.add('on'); busy = true; setTimeout(() => { busy = false; next(); }, delay); }
    else next();
    return;
  }
  if (kind === 'jump') return jump(+rest);
  if (kind === 'beat') return go(ST.pos[ST.demo].s, +rest, { anim: true, dir: 1 });
  if (kind === 'demo') return switchDemo(rest, false);
  if (kind === 'nav') {
    const steps = DEMOS[ST.demo].steps;
    for (let i = 0; i < steps.length; i++) {
      const st = steps[i];
      const nb = beatsOf(st, ctx({ s: i, b: 0 }));
      for (let b = 0; b < nb; b++) {
        if (val(st.nav, ctx({ s: i, b })) === rest) {
          const sb = $(`.sb-item[data-page="${rest}"]`);
          return go(i, b, { anim: true, dir: 1, stepChange: i !== ST.pos[ST.demo].s });
        }
      }
    }
    const sb = $(`.sb-item[data-page="${rest}"]`);
    if (sb) { sb.classList.remove('flash'); void sb.offsetWidth; sb.classList.add('flash'); }
  }
}
function ripple(el, e) {
  const cs = getComputedStyle(el);
  if (cs.position === 'static' || cs.overflow !== 'hidden') return;
  const r = el.getBoundingClientRect();
  const d = Math.max(r.width, r.height);
  const k = r.width / el.offsetWidth || 1;
  const sp = document.createElement('span');
  sp.className = 'ripple';
  sp.style.width = sp.style.height = d / k + 'px';
  sp.style.left = (e.clientX - r.left) / k - d / k / 2 + 'px';
  sp.style.top = (e.clientY - r.top) / k - d / k / 2 + 'px';
  el.appendChild(sp);
  setTimeout(() => sp.remove(), 520);
}

function renderCDP(c, step) {
  const D = DEMOS[c.demo];
  const key = val(step.subject, c);
  const S = SUBJECTS[key];
  const all = D.writes(c).map((w, i) => Object.assign({ i }, w));
  const mine = all.filter(w => w.subj === key && vis(w, c) && !(w.ty === 'pending' && w.s !== c.s));
  const fresh = mine.filter(w => isNew(w, c) && !w.hist);
  const base = c.cdpBase || val(step.cdpDelay, c) || 700;
  let n = 0;
  const delayOf = new Map(fresh.map(w => [w.i, base + (w.delay || 0) + (n++) * 240]));

  const pv = x => (typeof x === 'function' ? x(mine, c) : x);
  const head = `
    <div class="cdp-h"><span class="live-dot"></span><h2>What HUL learns</h2>
      <span class="src">${ic('database')}Freestand CDP</span></div>

        <div class="cdp-badges">${(S.badges ? S.badges(mine, c) : []).join('')}</div></div>
    </div>
    ${S.stats ? `<div class="cdp-stats">${S.stats(mine, c).map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>` : ''}`;

  // newest first, grouped by date
  const rows = mine.slice().sort((a, b) => b.i - a.i);
  let html = '', lastD = null;
  for (const w of rows) {
    if (w.d !== lastD) { html += `<div class="fd-date">${dShort(w.d)}</div>`; lastD = w.d; }
    const d = delayOf.get(w.i);
    const vHtml = w.dist ? distHTML(w.dist) : `<div class="wv">${w.v}</div>`;
    html += `<div class="w ${w.ty === 'pending' ? 'pending' : ''}"${d !== undefined ? rv(d, 'new') : ''}>
      <span class="wt t-${w.ty}">${TYPE_LABEL[w.ty]}</span>

  }

  $('#cdp').innerHTML = head + `<div class="cdp-feed" id="cdpFeed">${html}</div>`;
}
function distHTML(dist) {

/* ---------- render ---------- */
let lastRenderKey = '';
function render(opts = {}) {
  Sched.clear();
  const c = ctx({ anim: !!opts.anim, dir: opts.dir || 0 });
  const step = stepOf(c.demo, c.s);
  const nav = val(step.nav, c);
  const navChanged = nav !== lastNav;
  setNav(nav);
  renderHead(val(step.head, c), opts.stepChange, navChanged);
  const stage = $('#stage');
  const layoutKey = c.demo + ':' + c.s + ':' + (val(step.layoutKey, c) || '');
  const enter = opts.stepChange || layoutKey !== lastRenderKey;
  stage.innerHTML = `<div class="st ${enter ? (c.dir < 0 ? 'enter-back' : 'enter') : ''}">${step.view(c)}</div>`;
  lastRenderKey = layoutKey;
  renderCDP(c, step);
  renderStepbar(c, step, opts.stepChange);
  $('.workspace').classList.toggle('wide', !!val(step.wide, c));
  $$('.prog-toggle button').forEach(bt => bt.classList.toggle('on', c.s >= +bt.dataset.jump && c.s < +bt.dataset.end));
  fitAll();
  if (step.after) step.after(stage, c);
  $$('.wa-scroll, .call-body').forEach(sc => { sc.scrollTop = sc.scrollHeight; });
  runReveals(document);
  const feed = $('#cdpFeed'); if (feed) feed.scrollTop = 0;

}
function readHash() {
  const m = /^#(web)-(\d{1,2})$/.exec(location.hash || '');
  if (!m) return;
  const s = Math.min(Math.max(+m[2] - 1, 0), DEMOS[m[1]].steps.length - 1);
  ST.demo = m[1];
  ST.pos[m[1]] = { s, b: 0 };
}
function runReveals(root) {
  $$('[data-rv]', root).forEach(el => {
    el.classList.add('rv-hide');
    Sched.add(() => {
      el.classList.remove('rv-hide');
      el.classList.add(el.dataset.rvc || 'anim');
      const sc = el.closest('.wa-scroll, .call-body');
      if (sc) sc.scrollTop = sc.scrollHeight;
    }, +el.dataset.rv);
  });
  $$('[data-rvhide]', root).forEach(el => { Sched.add(() => { el.style.display = 'none'; }, +el.dataset.rvhide); });
  $$('[data-typing]', root).forEach(el => {
    const orig = el.innerHTML;
    el.dataset.typing.split(',').forEach(w => {
      const [a, b] = w.split('-').map(Number);
      Sched.add(() => { el.innerHTML = '<span class="typing">typing…</span>'; }, a);
      Sched.add(() => { el.innerHTML = orig; }, b);
    });
  });
}

/* ---------- fit phones + canvases to the stage ---------- */
const PHONE_W = 364, PHONE_H = 748;
function fitAll() {
  $$('.phone-slot').forEach(slot => {
    const col = slot.parentElement;
    const H = innerWidth <= 640 ? Math.min(innerHeight * 0.82, 700) : (col.clientHeight || 640);
    const k = Math.max(0.5, Math.min(1.08, (H - 6) / PHONE_H));
    slot.style.width = PHONE_W * k + 'px';
    slot.style.height = PHONE_H * k + 'px';
    slot.firstElementChild.style.transform = `scale(${k})`;
  });
  $$('.fit-box').forEach(box => {
    const inner = box.firstElementChild;
    if (inner.dataset.focus && inner.dataset.drawn) { inner.style.transition = 'none'; focusCanvas(inner, false); return; }
    const cw = +inner.dataset.w, ch = +inner.dataset.h;
    const W = box.clientWidth, H = box.clientHeight;
    const k = Math.min(W / cw, H / ch, 1.25);
    inner.style.transform = `translate(${(W - cw * k) / 2}px,${(H - ch * k) / 2}px) scale(${k})`;
  });
}
let rz = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(fitAll); });

/* ---------- command palette (⌘K) ---------- */
function openCmdk() {
  const bg = $('#cmdk');
  bg.classList.add('on');
  const inp = $('#cmdkIn');
  inp.value = '';
  drawCmdk('');
  setTimeout(() => inp.focus(), 10);
}
function closeCmdk() { $('#cmdk').classList.remove('on'); }
let cmdkSel = 0, cmdkItems = [];
function drawCmdk(q) {
  q = q.trim().toLowerCase();
  const items = [];
  for (const d of DEMO_ORDER) {
    DEMOS[d].steps.forEach((st, i) => {
      const cx = b => Object.assign(ctx({ s: i, b }), { demo: d, v: k => (ST.ch[d][k] ?? DEMOS[d].defaults[k]) });
      const cap = val(st.cap, cx(0));
      const nav = NAV_LABEL[val(st.nav, cx(0))] || ['', ''];
      const nb = Math.max(1, val(st.beats || 1, cx(0)));
      let text = `${nav[1]} ${DEMOS[d].title}`;
      for (let b = 0; b < nb; b++) { const cb = val(st.cap, cx(b)); const h = val(st.head, cx(b)); text += ` ${cb.t} ${cb.d} ${h.title}`; }
      text = text.toLowerCase();
      if (!q || q.split(/\s+/).every(t => text.includes(t))) items.push({ d, i, t: cap.t, g: DEMOS[d].title, nav: nav[1], icon: DEMOS[d].icon });
    });
  }
  cmdkItems = items;
  cmdkSel = Math.min(cmdkSel, Math.max(0, items.length - 1));
  let html = '', lastG = '';
  items.forEach((it, k) => {
    if (it.g !== lastG) { html += `<div class="cmdk-g">${it.g}</div>`; lastG = it.g; }
    html += `<div class="cmdk-it ${k === cmdkSel ? 'on' : ''}" data-k="${k}">${ic(it.icon)}<span>${esc(it.t)}</span><span class="muted tiny">· ${it.nav}</span><span class="n">Step ${it.i + 1}</span></div>`;
  });
  $('#cmdkList').innerHTML = html || '<div class="cmdk-g">No matches</div>';
}
function pickCmdk(k) {
  const it = cmdkItems[k];
  if (!it) return;
  closeCmdk();
  if (it.d !== ST.demo) { ST.demo = it.d; $$('.prog-toggle button').forEach(bt => bt.classList.toggle('on', bt.dataset.demo === it.d)); }
  ST.pos[it.d] = { s: it.i, b: 0 };
  render({ stepChange: true, anim: true, dir: 1 });
}

/* ---------- global events ---------- */
let busy = false;
function bindEvents() {
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (t && !t.disabled) {
      if (busy) return;
      ripple(t, e);
      if (t.closest('.phone, .scene')) {           // let the tap register visually before the screen moves on
        busy = true;
        setTimeout(() => { busy = false; doAct(t.dataset.act, t); }, 170);
      } else doAct(t.dataset.act, t);
      return;
    }
    const ck = e.target.closest('.cmdk-it');
    if (ck) return pickCmdk(+ck.dataset.k);
    if (e.target.id === 'cmdk') closeCmdk();
  });
  $('#btnNext').addEventListener('click', () => next());
  $('#btnBack').addEventListener('click', () => back());
  $$('.prog-toggle button').forEach(bt => bt.addEventListener('click', () => jump(+bt.dataset.jump)));
  $('#search').addEventListener('click', openCmdk);
  $('#cmdkIn').addEventListener('input', e => { cmdkSel = 0; drawCmdk(e.target.value); });
  document.addEventListener('keydown', e => {
    const open = $('#cmdk').classList.contains('on');
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); open ? closeCmdk() : openCmdk(); return; }
    if (open) {
      if (e.key === 'Escape') closeCmdk();
      else if (e.key === 'ArrowDown') { e.preventDefault(); cmdkSel = Math.min(cmdkSel + 1, cmdkItems.length - 1); drawCmdk($('#cmdkIn').value); scrollCmdk(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); cmdkSel = Math.max(cmdkSel - 1, 0); drawCmdk($('#cmdkIn').value); scrollCmdk(); }
      else if (e.key === 'Enter') { e.preventDefault(); pickCmdk(cmdkSel); }
      return;
    }
    if (e.target.closest('input,textarea')) return;
    if (busy) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); back(); }
  });
  // hover tooltips for chart marks
  const tip = $('#tip');
  document.addEventListener('mousemove', e => {
    const m = e.target.closest('[data-tip]');
    if (!m) { tip.classList.remove('on'); return; }
    tip.innerHTML = m.dataset.tip;
    tip.classList.add('on');
    const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + 'px';
    tip.style.top = e.clientY + 16 + 'px';
  });
}
function scrollCmdk() { const on = $('.cmdk-it.on'); if (on) on.scrollIntoView({ block: 'nearest' }); }

/* ---------- camera scanning the pack QR ---------- */
function qrSVG(seed = 7, n = 25) {
  let x = seed * 9973 % 2147483647;
  const rnd = () => (x = x * 48271 % 2147483647) / 2147483647;
  const on = Array.from({ length: n }, () => Array(n).fill(0));
  for (let r = 0; r < n; r++) for (let cc = 0; cc < n; cc++) on[r][cc] = rnd() > 0.52 ? 1 : 0;
  const finder = (r0, c0) => { for (let r = -1; r < 8; r++) for (let cc = -1; cc < 8; cc++) { const rr = r0 + r, c2 = c0 + cc; if (rr < 0 || c2 < 0 || rr >= n || c2 >= n) continue; const edge = r === -1 || cc === -1 || r === 7 || cc === 7; const ring = r === 0 || cc === 0 || r === 6 || cc === 6; const core = r >= 2 && r <= 4 && cc >= 2 && cc <= 4; on[rr][c2] = edge ? 0 : (ring || core) ? 1 : 0; } };
  finder(0, 0); finder(0, n - 7); finder(n - 7, 0);
  for (let i = 8; i < n - 8; i++) { on[6][i] = i % 2 ? 0 : 1; on[i][6] = i % 2 ? 0 : 1; }
  for (let r = n - 9; r < n - 4; r++) for (let cc = n - 9; cc < n - 4; cc++) { const e = r === n - 9 || r === n - 5 || cc === n - 9 || cc === n - 5; on[r][cc] = e || (r === n - 7 && cc === n - 7) ? 1 : 0; }
  let d = '';
  for (let r = 0; r < n; r++) { let cc = 0; while (cc < n) { if (on[r][cc]) { let e = cc; while (e < n && on[r][e]) e++; d += `M${cc} ${r}h${e - cc}v1h-${e - cc}z`; cc = e; } else cc++; } }
  return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" shape-rendering="crispEdges"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="#fff"/><path d="${d}" fill="#111"/></svg>`;
}

function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;

  r = adj(r); g = adj(g); b = adj(b);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);

/* ---------- Chrome for Android ---------- */
function chromeScreen(inner, o = {}) {
  let omni;
  if (o.query) omni = `${crg('search')}<span class="cr-url">${esc(o.query)}</span>`;
  else {
    const [host, ...rest] = (o.url || 'bebeautiful.in').split('/');
    omni = `${crg('tune')}<span class="cr-url">${host}${rest.length ? `<i>/${rest.join('/')}</i>` : ''}</span>`;
  }
  return `<div class="cr">
    <div class="cr-bar"><span class="cr-ic">${crg('home')}</span><div class="cr-omni">${omni}</div><span class="cr-tabs">${o.tabs || 6}</span><span class="cr-ic">${gl('more')}</span></div>
    ${o.load ? '<div class="cr-load"><i></i></div>' : ''}
    <div class="cr-page">${inner}</div>
    ${o.overlay || ''}
  </div>`;
}


/* the embedded Freestand form card */
function fsForm(inner, o = {}) {
  return `<div class="fsf ${o.cls || ''}"${o.rv != null ? rv(o.rv, 'pop') : ''}>
    <div class="fsf-top"><span class="fsf-step">Step ${o.n} of ${o.of || 4} · ${o.step}</span><span class="fsf-dots">${Array.from({ length: o.of || 4 }, (_, k) => k + 1).map(i => `<i class="${i < o.n ? 'd' : i === o.n ? 'c' : ''}"></i>`).join('')}</span></div>
    ${inner}
  </div>`;
}
/* an outlined input; o.at = ms when the typed value appears (animated), o.ph placeholder */
function wField(label, value, o = {}) {
  let v;
  if (!value) v = `<span class="fp">${o.ph || ''}</span>`;
  else if (o.at != null) v = `<span class="fp" data-rvhide="${o.at}">${o.ph || ''}</span><span class="fv"${rv(o.at, 'typein')}>${value}</span>`;
  else v = `<span class="fv">${value}</span>`;
  return `<div class="wf ${o.cls || ''}"><label>${label}</label><div class="wf-in">${o.pre ? `<span class="wf-pre">${o.pre}</span>` : ''}${v}</div>${o.after || ''}</div>`;
}
/* a button that becomes live at o.at (ms) when animating */
function wCta(label, act, o = {}) {
  const cls = o.cls || '';
  if (o.still) return `<div class="wcta ${cls}">${label}</div>`;   // shown behind an overlay: looks the same, not tappable
  if (o.at != null) return `<div class="wcta off ${cls}" data-rvhide="${o.at}">${label}</div><div class="wcta live hint ${cls}" data-act="${act}"${rv(o.at, 'x')}>${label}</div>`;
  return `<div class="wcta ${act ? 'live' : 'off'} ${o.hint === false ? '' : 'hint'} ${cls}"${act ? ` data-act="${act}"` : ''}>${label}</div>`;
}
function otpBoxes(code, o = {}) {

/* =================================================================
   Freestand analytics, as the product shows them:
   Analytics V2 (Overview · Live Analytics · Data Visualisation) and
   MagicFlow WhatsApp analytics. Palette validated with the dataviz
   checks: Freestand blue 700, orange, blue 400, amber (stepped).
   ================================================================= */
const AV = { s1: '#0A49B7', s2: '#e8671b', s3: '#538FF6', s4: '#b87800', crit: '#c8322b', grid: '#e7ebf2', axis: '#8a94a6', ink: '#1f2937' };
const avTip = (title, rows) => esc(`<b>${title}</b>${rows.map(r => `<br>${r}`).join('')}`);

/* deterministic daily series, 4 Aug to 30 Sep 2026 (58 days) */
const AV_DAYS = Array.from({ length: 58 }, (_, i) => { const d = new Date(Date.UTC(2026, 7, 4 + i)); return { d, lbl: `${d.getUTCDate()} ${MON3[d.getUTCMonth()]}` }; });
function avSpread(total, weights) {
  const sum = weights.reduce((a, b) => a + b, 0);
  const out = weights.map(w => Math.floor(total * w / sum));
  let rest = total - out.reduce((a, b) => a + b, 0);
  for (let i = 0; rest > 0; i = (i + 1) % out.length) if (weights[i] > 0) { out[i]++; rest--; }
  return out;
}
const AV_CLAIMS = avSpread(5000, AV_DAYS.map((x, i) => (i > 39 ? 0 : (0.55 + 0.45 * Math.min(1, i / 6)) * (1.18 - i / 90) * ([0, 6].includes(x.d.getUTCDay()) ? 1.22 : 1) * (1 + 0.12 * Math.sin(i * 1.7)))));
const AV_DELIV = avSpread(4318, AV_DAYS.map((_, i) => (i < 1 ? 0 : (AV_CLAIMS[i - 1] || 0) * 0.6 + (AV_CLAIMS[i - 2] || 0) * 0.4)));
const AV_FEED = avSpread(3022, AV_DAYS.map((_, i) => (i < 3 ? 0 : (AV_DELIV[i - 3] || 0))));

/* ---------- combo chart: bars Claims + Deliveries, line Feedbacks (one axis) ---------- */
function avCombo(cumulative) {
  const W = 660, H = 250, L = 44, R = 12, T = 14, B = 30;
  const n = AV_DAYS.length, bw = (W - L - R) / n;
  const cum = a => a.reduce((acc, v, i) => (acc.push((acc[i - 1] || 0) + v), acc), []);
  const C = cumulative ? cum(AV_CLAIMS) : AV_CLAIMS, D = cumulative ? cum(AV_DELIV) : AV_DELIV, F = cumulative ? cum(AV_FEED) : AV_FEED;
  const max = cumulative ? 5000 : 200, step = cumulative ? 1000 : 50;
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = '';

/* ---------- donut with 2px surface gaps and direct labels ---------- */
function avDonut(parts, o = {}) {
  const cols = [AV.s1, AV.s2, AV.s3, AV.s4];
  const R = 62, r = 38, cx = 80, cy = 80;
  let a0 = -Math.PI / 2, segs = '';

}
(function boot() {
  buildShell();
  renderSidebar();
  bindEvents();
  readHash();
  $$('.prog-toggle button').forEach(bt => bt.classList.toggle('on', bt.dataset.demo === ST.demo));
  render({ stepChange: true, anim: true, dir: 1 });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitAll());
  // a deep link pasted into an open tab (render() itself uses replaceState, which doesn't fire this)
  window.addEventListener('hashchange', () => {
    readHash();
    $$('.prog-toggle button').forEach(bt => bt.classList.toggle('on', bt.dataset.demo === ST.demo));
    render({ stepChange: true, anim: true, dir: 1 });
  });
})();
