<style>
/* ================================================================
   Freestand · HUL BeBeautiful Box: app shell + demo components
   ================================================================ */
:root{--wa-doodle:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22170%22 height=%22170%22 viewBox=%220 0 170 170%22 fill=%22none%22 stroke=%22#cbbfae%22 stroke-width=%221.3%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 opacity=%22.55%22%3E%3Ccircle cx=%2222%22 cy=%2224%22 r=%228%22/%3E%3Cpath d=%22M60 14l4 8 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z%22/%3E%3Cpath d=%22M110 20c6-8 18-2 12 8l-12 10-12-10c-6-10 6-16 12-8z%22/%3E%3Crect x=%22140%22 y=%2212%22 width=%2218%22 height=%2224%22 rx=%223%22/%3E%3Cpath d=%22M144 18h10M144 24h10M144 30h6%22/%3E%3Cpath d=%22M16 70c10-14 26-14 34 0%22 /%3E%3Cpath d=%22M20 78h26%22/%3E%3Ccircle cx=%2284%22 cy=%2270%22 r=%2212%22/%3E%3Cpath d=%22M78 70h12M84 64v12%22/%3E%3Cpath d=%22M122 60h24v18a8 8 0 0 1-8 8h-8a8 8 0 0 1-8-8z%22/%3E%3Cpath d=%22M146 66h5a4 4 0 0 1 0 8h-5%22/%3E%3Cpath d=%22M20 120l14-14 14 14-14 14z%22/%3E%3Cpath d=%22M70 110c8 0 14 6 14 14s-6 14-14 14%22/%3E%3Cpath d=%22M64 118l6 6-6 6%22/%3E%3Cpath d=%22M112 112h30l-6 22h-18z%22/%3E%3Cpath d=%22M118 112c0-8 18-8 18 0%22/%3E%3Ccircle cx=%2230%22 cy=%22156%22 r=%224%22/%3E%3Ccircle cx=%2246%22 cy=%22150%22 r=%223%22/%3E%3Cpath d=%22M84 150l10 10M94 150l-10 10%22/%3E%3Cpath d=%22M130 150c4 6 12 6 16 0%22/%3E%3C/svg%3E");--lock-ic:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22#667781%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Crect x=%224%22 y=%2211%22 width=%2216%22 height=%2210%22 rx=%222%22/%3E%3Cpath d=%22M8 11V7a4 4 0 0 1 8 0v4%22/%3E%3C/svg%3E");
  --sb-w:232px; --tb-h:54px; --cdp-w:clamp(304px,24.5vw,392px);
  --navy:#0D2A69; --navy-deep:#0A2259; --navy-line:#1a3d70; --side-fg:#c1cce0; --side-dim:#7086ad; --side-icon:#8fa3c7; --side-accent:#1a4a8a; --side-primary:#3b82f6;
  --primary:#0a3578; --primary-2:#1b4fa0; --primary-soft:#eaf0fa; --primary-soft-2:#d7e3f6;
  --bg:#f3f5f9; --card:#fff; --line:#e3e8f0; --line-2:#d2dae6; --fg:#101a31; --fg-2:#34425e; --muted:#627089; --muted-2:#98a4b8;
  --green:#10b981; --green-ink:#047857; --green-soft:#e6f7f0;
  --amber:#f59e0b; --amber-ink:#a65a06; --amber-soft:#fdf4e3;
  --blue:#3b82f6; --blue-ink:#1d4ed8; --blue-soft:#eaf1fe;
  --red:#e11d48; --red-ink:#be123c; --red-soft:#fde9ee;
  --violet:#7c3aed; --violet-ink:#6d28d9; --violet-soft:#f2ecfe;
  --indigo:#6366f1;
  --orange:#FF6B00; --yellow:#FFC20E; --scene-navy:#0B2E6E;
  --wa:#25D366; --wa-green:#00a884; --wa-ink:#111b21; --wa-sub:#667781; --wa-link:#0b8bd1;
  --r-sm:6px; --r:10px; --r-lg:14px;
  --sh-1:0 1px 2px rgba(16,26,49,.06),0 1px 1px rgba(16,26,49,.03);
  --sh-2:0 6px 20px rgba(16,26,49,.07),0 1px 3px rgba(16,26,49,.06);
  --sh-3:0 24px 60px rgba(10,34,89,.20),0 6px 18px rgba(10,34,89,.10);
  --blush:#F6D9D5; --cream:#FBF5EF;
  --font:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --pf:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{flex:none}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
.ic.fill{fill:currentColor;stroke:none}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* ---------------- App grid ---------------- */
.app{display:grid;grid-template-columns:var(--sb-w) minmax(0,1fr);grid-template-rows:var(--tb-h) minmax(0,1fr);height:100vh;min-height:620px}

/* ---------------- Topbar ---------------- */
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;background:var(--navy-deep);color:#fff;padding:0 16px 0 0;border-bottom:1px solid var(--navy-line);position:relative;z-index:5}
.tb-brand{width:var(--sb-w);flex:none;display:flex;align-items:center;padding-left:22px;height:100%;border-right:1px solid rgba(255,255,255,.08)}
.tb-brand svg{height:21px;width:auto;color:#fff}
.ws{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:9px;cursor:pointer;transition:background .15s;flex:none}
.ws:hover{background:rgba(255,255,255,.07)}
.ws-badge{width:28px;height:28px;border-radius:7px;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.ws-badge svg{width:22px;height:22px}
.ws-name{font-size:13px;font-weight:600;letter-spacing:-.005em;line-height:1.15}
.ws-sub{font-size:11px;color:#9fb0cf;line-height:1.2}
.ws .ic{width:15px;height:15px;color:#9fb0cf}
.prog{flex:1;display:flex;justify-content:center;min-width:0;padding:0 6px}
.prog-toggle{display:flex;gap:3px;padding:3px;border-radius:11px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);max-width:100%;min-width:0}
.prog-toggle button{display:flex;align-items:center;gap:8px;height:34px;padding:0 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:#c3d0e8;white-space:nowrap;transition:background .2s,color .2s;min-width:0;flex:0 1 auto}
.prog-toggle button .pt-txt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.prog-toggle button:hover{color:#fff;background:rgba(255,255,255,.06)}
.prog-toggle button .ic{width:15px;height:15px}
.prog-toggle button .pt-sub{font-weight:500;color:#8ea1c4;font-size:11.5px;display:none}
@media (min-width:1720px){.prog-toggle button .pt-sub{display:inline}}
.prog-toggle button.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.prog-toggle button.on .pt-sub{color:var(--muted)}
.prog-toggle button .pt-dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.18)}
.tb-right{display:flex;align-items:center;gap:8px;flex:none}
.search{display:flex;align-items:center;gap:9px;width:232px;height:34px;padding:0 8px 0 11px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#9fb0cf;font-size:12.5px;cursor:text;transition:background .15s,border-color .15s}
.search:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.search .ic{width:15px;height:15px}
.search span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:600 10.5px/1 var(--font);padding:4px 6px;border-radius:5px;background:rgba(255,255,255,.12);color:#dbe4f5;border:1px solid rgba(255,255,255,.14)}
.tb-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#b9c7e0;position:relative;transition:background .15s}
.tb-icon:hover{background:rgba(255,255,255,.08);color:#fff}
.tb-icon .ic{width:18px;height:18px}
.tb-icon .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#fb923c;box-shadow:0 0 0 2px var(--navy-deep)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,#3b82f6,#1d4ed8);box-shadow:0 0 0 2px rgba(255,255,255,.15)}

/* ---------------- Sidebar ---------------- */
.sidebar{background:var(--navy);color:var(--side-fg);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--navy-line)}
.sb-scroll{flex:1;overflow-y:auto;padding:8px 10px 10px;scrollbar-width:none}
.sb-scroll::-webkit-scrollbar{display:none}
.sb-group{margin-top:10px}
.sb-label{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--side-dim);padding:6px 10px 5px}
.sb-item{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:500;color:var(--side-fg);cursor:pointer;position:relative;transition:background .2s,color .2s;user-select:none}
.sb-item .ic{width:17px;height:17px;color:var(--side-icon);transition:color .2s}
.sb-item:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-item.on{background:var(--side-accent);color:#fff;font-weight:600}
.sb-item.on .ic{color:#fff}
.sb-item.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#60a5fa}
.sb-item .sb-badge{margin-left:auto;min-width:19px;height:19px;padding:0 6px;border-radius:10px;background:var(--side-primary);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center}
.sb-item .sb-live{margin-left:auto;font-size:10px;font-weight:600;color:#6ee7b7;display:flex;align-items:center;gap:5px}
.sb-item .sb-live i{width:6px;height:6px;border-radius:50%;background:#34d399;animation:pulse 1.8s infinite}
.sb-item.flash{animation:sbflash 1.1s ease}
@keyframes sbflash{0%{box-shadow:0 0 0 0 rgba(96,165,250,.0)}25%{box-shadow:0 0 0 3px rgba(96,165,250,.45)}100%{box-shadow:0 0 0 0 rgba(96,165,250,0)}}
.sb-foot{border-top:1px solid var(--navy-line);padding:10px 12px;display:flex;align-items:center;gap:10px}
.sb-foot .avatar{width:30px;height:30px;font-size:11px;background:linear-gradient(135deg,#f97316,#ea580c)}
.sb-foot .u-n{font-size:12.5px;font-weight:600;color:#fff;line-height:1.2}
.sb-foot .u-r{font-size:11px;color:#9fb0cf;line-height:1.25}
.sb-foot .ic{margin-left:auto;width:15px;height:15px;color:#8fa3c7}

/* ---------------- Main ---------------- */
.main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:14px 18px 14px;min-height:0;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;min-height:48px}
.ph-l{min-width:0}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:3px}
.crumbs .sep{color:var(--muted-2)}
.ph-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph-title h1{margin:0;font-size:20px;line-height:1.25;font-weight:650;letter-spacing:-.015em;white-space:nowrap}
.ph-r{display:flex;align-items:center;gap:8px;flex:none}
.ph-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.ph-meta .ic{width:14px;height:14px}
.page-head.swap .ph-l,.page-head.swap .ph-r{animation:fadeIn .35s ease}

.workspace{display:grid;grid-template-columns:minmax(0,1fr) var(--cdp-w);gap:14px;min-height:0}
.stage{position:relative;min-height:0;min-width:0;display:flex}
.stage>.st{flex:1;min-width:0;min-height:0;display:flex}
.st.enter{animation:stageIn .45s cubic-bezier(.2,.7,.2,1)}
.st.enter-back{animation:stageInBack .35s cubic-bezier(.2,.7,.2,1)}
@keyframes stageIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes stageInBack{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.92)}60%{opacity:1;transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------------- Generic UI ---------------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:13.5px;font-weight:650;letter-spacing:-.005em}
.card-h .sub{font-size:11.5px;color:var(--muted)}
.card-h .grow{flex:1;min-width:0}
.card-b{padding:12px 14px}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:#eef1f6;color:var(--fg-2);border:1px solid transparent}
.chip .ic{width:12px;height:12px}
.chip.green{background:var(--green-soft);color:var(--green-ink)}
.chip.amber{background:var(--amber-soft);color:var(--amber-ink)}
.chip.blue{background:var(--blue-soft);color:var(--blue-ink)}
.chip.red{background:var(--red-soft);color:var(--red-ink)}
.chip.violet{background:var(--violet-soft);color:var(--violet-ink)}
.chip.navy{background:var(--primary-soft);color:var(--primary)}
.chip.outline{background:#fff;border-color:var(--line-2);color:var(--fg-2)}
.chip.wag{background:#e8f8ee;color:#128c4a}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip .dot.live{animation:pulse 1.6s infinite}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--line-2);background:#fff;color:var(--fg);white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{background:#f7f9fc;border-color:#c5cfdf}
.btn .ic{width:15px;height:15px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:#0d3f8c}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12.5px}
.kv dt{color:var(--muted);white-space:nowrap}
.kv dd{margin:0;font-weight:500;color:var(--fg);min-width:0}
.muted{color:var(--muted)}
.tiny{font-size:11px}
.sep-v{width:1px;align-self:stretch;background:var(--line)}
.pbar{height:6px;border-radius:4px;background:#e8edf4;overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:4px;background:var(--primary)}

/* ---------------- Layouts inside stage ---------------- */
.lay-phone{flex:1;display:grid;grid-template-columns:auto minmax(0,540px);gap:22px;justify-content:center;align-items:center;min-height:0;min-width:0}
.lay-phone.solo{grid-template-columns:auto}
.phone-col{display:flex;align-items:center;justify-content:center;min-height:0;height:100%}
.side-col{display:flex;flex-direction:column;gap:12px;min-height:0;max-height:100%;overflow:auto;padding:2px;scrollbar-width:thin}
.lay-rule{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;min-height:0}
.lay-rule .rule-col{min-height:0;max-height:100%;overflow:auto;padding:2px}
.lay-vsplit{flex:1;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px;min-height:0}
.lay-hsplit{flex:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:14px;min-height:0}
.lay-page{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:2px;scrollbar-width:thin}
.lay-page>*{flex:none}
.lay-scene{flex:1;display:flex;min-height:0}

/* ---------------- Scene (Tide illustration language) ---------------- */
.scene{flex:1;display:flex;flex-direction:column;border-radius:var(--r-lg);overflow:hidden;background:#e8eef6;border:1px solid #d6dfeb;box-shadow:var(--sh-1);min-height:0;min-width:0;position:relative}
.loc-bar{position:relative;z-index:2;flex:none;height:42px;display:flex;align-items:center;justify-content:center;background:var(--scene-navy);color:#fff;font:700 12.5px/1 var(--pf);letter-spacing:.34em;text-transform:uppercase;white-space:nowrap;overflow:hidden;padding:0 12px}
.loc-bar .dotsep{margin:0 .7em;opacity:.8}
.scene-svg{flex:1;width:100%;height:100%;min-height:0;display:block;overflow:visible}
.scene-svg text{font-family:var(--pf)}
.sv-in{animation:svIn .6s cubic-bezier(.2,.7,.2,1) both}
.sv-pop{animation:svPop .5s cubic-bezier(.2,.8,.2,1.2) both;transform-box:fill-box;transform-origin:50% 100%}
.sv-walk{animation:svWalk .9s cubic-bezier(.2,.7,.2,1) both}
.sv-fade{animation:fadeIn .5s ease both}
@keyframes svIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes svPop{0%{opacity:0;transform:scale(.8)}70%{opacity:1;transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes svWalk{from{opacity:0;transform:translateX(120px)}to{opacity:1;transform:none}}
.nod{animation:nod 1.6s ease-in-out 2;transform-box:fill-box;transform-origin:50% 90%}
@keyframes nod{0%,100%{transform:rotate(0)}25%{transform:rotate(4deg)}50%{transform:rotate(-1deg)}75%{transform:rotate(3deg)}}
.ring-v{animation:ringv .5s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes ringv{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.ring-w{animation:ringw 1.2s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes ringw{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(1.5)}}
.sv-click{cursor:pointer}
.sv-click:hover{filter:brightness(1.06)}
/* call waveform bars */
.wbar{animation:wvb 1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes wvb{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.25)}}
.pulse-ring{animation:pring 1.5s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}

/* ---------------- CDP panel ---------------- */
.cdp{display:flex;flex-direction:column;min-height:0;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.cdp-h{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.cdp-h h2{margin:0;font-size:14px;font-weight:650;letter-spacing:-.01em}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.18);animation:pulse 1.8s infinite}
.cdp-h .src{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:500}
.cdp-h .src .ic{width:13px;height:13px}
.cdp-p{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:flex-start}
.cdp-av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13.5px;font-weight:700;color:#fff}
.cdp-av .ic{width:19px;height:19px}
.cdp-pn{font-size:14px;font-weight:650;line-height:1.25;letter-spacing:-.005em}
.cdp-pm{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:1px}
.cdp-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.cdp-badges .chip{height:20px;font-size:10.5px;padding:0 7px}
.cdp-stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.cdp-stats div{padding:8px 12px;border-right:1px solid var(--line)}
.cdp-stats div:last-child{border-right:0}
.cdp-stats b{display:block;font-size:15px;font-weight:650;letter-spacing:-.01em}
.cdp-stats span{font-size:10.5px;color:var(--muted);font-weight:500}
.cdp-feed{flex:1;overflow-y:auto;padding:4px 10px 12px;scrollbar-width:thin;position:relative}
.cdp-empty{margin:16px 6px;padding:14px;border:1px dashed var(--line-2);border-radius:10px;color:var(--muted);font-size:12.5px;line-height:1.5;background:#fafbfd}
.cdp-empty b{color:var(--fg-2)}
.fd-date{position:sticky;top:0;z-index:1;background:linear-gradient(#fff 75%,rgba(255,255,255,0));padding:9px 4px 5px;font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2)}
.w{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 9px;padding:8px 8px 8px 8px;border-radius:10px;border:1px solid transparent;margin-bottom:2px;position:relative}
.w+.w{border-top-color:transparent}
.w .wt{grid-row:1/3;align-self:start;margin-top:1px;font-size:9px;font-weight:700;letter-spacing:.07em;padding:3px 5px;border-radius:4px;min-width:62px;text-align:center}
.w .wk{font-size:11.5px;color:var(--muted);line-height:1.3;display:flex;gap:6px;justify-content:space-between;align-items:baseline}
.w .wk .ts{font:500 10.5px/1 var(--mono);color:var(--muted-2);white-space:nowrap}
.w .wv{font-size:13px;font-weight:600;color:var(--fg);line-height:1.35;word-break:break-word}
.w .wmeta{grid-column:2;display:flex;align-items:center;gap:6px;margin-top:1px}
.src-chip{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:999px;border:1px solid var(--line);font-size:10.5px;font-weight:600;color:var(--fg-2);background:#fff;white-space:nowrap}
.src-chip .ic{width:11px;height:11px}
.w.new{animation:wIn .55s cubic-bezier(.2,.8,.2,1) both,wGlow 2.6s ease .15s both}
@keyframes wIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes wGlow{0%{background:#fff8e1;border-color:#fde7a8}100%{background:#fff;border-color:transparent}}
.w.pending{border:1px dashed #c9d3e2;background:#fafbfd}
.w.pending .wv{color:var(--fg-2)}
.w .spin{width:11px;height:11px;border-radius:50%;border:2px solid #c7d2e3;border-top-color:var(--primary);animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.w.hidden{display:none}
.t-consent{background:var(--green-soft);color:var(--green-ink)}
.t-trait{background:var(--blue-soft);color:var(--blue-ink)}
.t-event{background:#eef1f6;color:#475569}
.t-identity{background:var(--violet-soft);color:var(--violet-ink)}
.t-address{background:var(--amber-soft);color:var(--amber-ink)}
.t-cohort{background:var(--primary-soft);color:var(--primary)}
.t-signal{background:#fff0e5;color:#c2410c}
.t-metric{background:#eef1f6;color:#334260}
.t-pending{background:#f1f4f9;color:#64748b}
.dist{display:flex;height:8px;border-radius:5px;overflow:hidden;margin:6px 0 3px;gap:2px}
.dist i{display:block;height:100%}
.dist-l{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11px;color:var(--fg-2);font-weight:500}
.dist-l span{display:inline-flex;align-items:center;gap:4px}
.dist-l span i{width:8px;height:8px;border-radius:2px;display:inline-block}

/* ---------------- Step bar ---------------- */
.stepbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:stretch}
.sb-card{display:flex;align-items:center;gap:14px;min-width:0;padding:11px 16px;border-radius:12px;background:var(--scene-navy);color:#fff;box-shadow:0 8px 24px rgba(11,46,110,.18)}
.step-chip{flex:none;background:var(--orange);color:#fff;font:800 12.5px/1 var(--pf);letter-spacing:.12em;padding:8px 11px;border-radius:7px;text-transform:uppercase;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.sb-txt{min-width:0;flex:1}
.sb-t{font:700 15.5px/1.25 var(--pf);letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-c{font:400 12.5px/1.4 var(--pf);color:#d5def0;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sb-card.swap .sb-txt,.sb-card.swap .step-chip{animation:fadeUp .35s ease}
.beats{display:flex;gap:5px;flex:none;align-items:center}
.beats i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);transition:background .25s,transform .25s}
.beats i.done{background:#ffb27a}
.beats i.cur{background:#fff;transform:scale(1.25)}
.sb-nav{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 14px;box-shadow:var(--sh-1)}
.prog-wrap{display:flex;flex-direction:column;gap:7px;min-width:170px}
.prog-lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;color:var(--fg-2)}
.prog-lbl span{font-weight:500;color:var(--muted);font-size:11px}
.segs{display:flex;gap:3px}
.segs button{flex:1;height:6px;border-radius:3px;background:#dfe5ee;transition:background .25s;min-width:10px;position:relative}
.segs button::after{content:"";position:absolute;inset:-6px 0}
.segs button:hover{background:#c5cfdd}
.segs button.done{background:var(--primary)}
.segs button.cur{background:var(--orange)}
.nav-btn{height:38px;display:inline-flex;align-items:center;gap:6px;padding:0 13px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid var(--line-2);background:#fff;transition:background .15s,opacity .15s}
.nav-btn:hover{background:#f5f7fb}
.nav-btn:disabled{opacity:.4;cursor:default}
.nav-btn .ic{width:16px;height:16px}
.nav-btn.next{background:var(--primary);border-color:var(--primary);color:#fff;padding:0 14px 0 16px}
.nav-btn.next:hover{background:#0d3f8c}
.nav-btn.next.nudge{box-shadow:0 0 0 0 rgba(10,53,120,.45);animation:nudge 1.8s ease-out infinite}
@keyframes nudge{0%{box-shadow:0 0 0 0 rgba(10,53,120,.45)}100%{box-shadow:0 0 0 10px rgba(10,53,120,0)}}
.kbd-hint{font-size:10.5px;color:var(--muted-2);display:flex;gap:4px;align-items:center}
.kbd-hint kbd{background:#f1f4f8;color:var(--muted);border-color:var(--line)}

/* ---------------- Phone ---------------- */
.phone-slot{position:relative;flex:none}
.phone{position:absolute;left:0;top:0;width:364px;height:748px;transform-origin:0 0;border-radius:50px;background:#0b0d12;padding:10px;box-shadow:0 0 0 1.5px #2b313b,0 0 0 3px #0b0d12,var(--sh-3)}
.phone::before{content:"";position:absolute;right:-4px;top:150px;width:3px;height:64px;border-radius:0 2px 2px 0;background:#1d222b}
.phone::after{content:"";position:absolute;right:-4px;top:236px;width:3px;height:104px;border-radius:0 2px 2px 0;background:#1d222b}
.ph-screen{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:#fff;display:flex;flex-direction:column;font-family:var(--pf);color:var(--wa-ink)}
.ph-cam{position:absolute;left:50%;top:9px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:#050608;box-shadow:inset 0 0 0 2px #1a1f28;z-index:30}
.ph-status{flex:none;height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-size:12.5px;font-weight:500;position:relative;z-index:20}
.ph-status .st-r{display:flex;align-items:center;gap:5px}
.ph-status svg{width:15px;height:15px}
.ph-status.dark{color:#fff}
.ph-app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.ph-gest{flex:none;height:18px;display:flex;align-items:center;justify-content:center;background:inherit}
.ph-gest i{width:108px;height:4px;border-radius:3px;background:rgba(0,0,0,.72)}
.ph-gest.dark i{background:rgba(255,255,255,.8)}
.ripple{position:absolute;border-radius:50%;background:rgba(0,0,0,.14);transform:scale(0);animation:rip .5s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(2.6);opacity:0}}

/* ---------------- WhatsApp ---------------- */
.wa{flex:1;display:flex;flex-direction:column;min-height:0;background:#efeae2;position:relative}
.wa-head{flex:none;height:56px;display:flex;align-items:center;gap:6px;padding:0 6px 0 4px;background:#fff;box-shadow:0 1px 0 rgba(11,20,26,.08);position:relative;z-index:3}
.wa-head .hb{width:30px;height:36px;display:grid;place-items:center;border-radius:50%;color:#3b4a54;position:relative;overflow:hidden}
.wa-head .hb svg{width:22px;height:22px}
.wa-av{width:38px;height:38px;border-radius:50%;flex:none;background:#fff;box-shadow:0 0 0 1px #e9edef;display:grid;place-items:center;overflow:hidden}
.wa-av svg{width:30px;height:30px}
.wa-id{flex:1;min-width:0;padding-left:5px}
.wa-name{font-size:15.5px;font-weight:500;display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;letter-spacing:-.1px}
.wa-name svg{width:16px;height:16px}
.wa-sub{font-size:12.5px;color:var(--wa-sub);white-space:nowrap;height:16px;overflow:hidden}
.wa-sub .typing{color:var(--wa-green);font-weight:500}
.wa-body{flex:1;min-height:0;position:relative;background-color:#efeae2}
.wa-body::before{content:"";position:absolute;inset:0;background-image:var(--wa-doodle);background-size:340px;opacity:.55;pointer-events:none}
.wa-scroll{position:absolute;inset:0;overflow-y:auto;padding:8px 10px 10px;scrollbar-width:none;display:flex;flex-direction:column}
.wa-scroll::-webkit-scrollbar{display:none}
.wa-scroll>.spacer{flex:1}
.wa-date{align-self:center;margin:8px 0 6px;padding:5px 12px;border-radius:8px;background:#fff;color:#54656f;font-size:12.5px;box-shadow:0 1px .5px rgba(11,20,26,.1)}
.wa-biz{align-self:center;width:86%;margin:10px 0 4px;padding:14px 14px 12px;border-radius:12px;background:#fff;text-align:center;box-shadow:0 1px .5px rgba(11,20,26,.1);display:flex;flex-direction:column;align-items:center;gap:3px}
.wa-biz-av{width:62px;height:62px;border-radius:50%;box-shadow:0 0 0 1px #e9edef;display:grid;place-items:center;margin-bottom:4px}
.wa-biz b{font-size:15.5px;font-weight:500;display:flex;align-items:center;gap:3px}
.wa-biz b svg{width:15px;height:15px}
.wa-biz span{font-size:12.5px;color:#667781}
.wa-biz p{margin:5px 0 0;font-size:12.5px;line-height:1.4;color:#3b4a54}
.wa-sys{align-self:center;max-width:88%;margin:6px 0 8px;padding:6px 10px;border-radius:8px;background:#fff5c4;color:#54656f;font-size:12px;line-height:1.35;text-align:center;box-shadow:0 1px .5px rgba(11,20,26,.1)}
.wa-sys svg{width:11px;height:11px;vertical-align:-1px;margin-right:3px}
.wm{display:flex;flex-direction:column;margin-top:2px;max-width:84%;position:relative}
.wm.in{align-self:flex-start}
.wm.out{align-self:flex-end}
.wm.first{margin-top:8px}
.wb{position:relative;background:#fff;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13);padding:6px 8px 7px 9px;font-size:14.3px;line-height:19px;color:var(--wa-ink);min-width:88px}
.wm.out .wb{background:#d9fdd3}
.wm.in.first .wb{border-top-left-radius:0}
.wm.out.first .wb{border-top-right-radius:0}
.wm.in.first .wb::before{content:"";position:absolute;left:-8px;top:0;border-top:0 solid transparent;border-right:8px solid #fff;border-bottom:10px solid transparent}
.wm.out.first .wb::before{content:"";position:absolute;right:-8px;top:0;border-left:8px solid #d9fdd3;border-bottom:10px solid transparent}
.wb .tx{white-space:pre-wrap;word-wrap:break-word}
.wb .tx b{font-weight:700}
.wb .hdr{font-weight:700;font-size:15px;margin-bottom:3px;line-height:20px}
.wb .ft{font-size:12.7px;color:#8696a0;margin-top:5px;line-height:16px}
.wb .meta{float:right;margin:6px 0 -5px 10px;font-size:11px;color:var(--wa-sub);display:inline-flex;align-items:center;gap:3px;line-height:15px;position:relative;top:3px}
.wb .meta svg{width:16px;height:11px}
.wb .media{margin:-3px -5px 6px -6px;border-radius:6px;overflow:hidden;position:relative;background:#e9edef}
.wb .media img{display:block;width:100%}
.wb .quote{margin:-2px -4px 5px -5px;padding:5px 8px 5px 9px;border-radius:6px;background:rgba(11,20,26,.05);border-left:4px solid #06cf9c;font-size:12.8px;line-height:16px;color:#667781;overflow:hidden}
.wm.out .wb .quote{background:rgba(11,20,26,.06)}
.wb .quote .qn{color:#06a07c;font-weight:500;font-size:12.8px;display:block;margin-bottom:1px}
.wb .quote .qt{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.wb .ref{display:flex;gap:8px;margin:-2px -4px 6px -5px;padding:6px;border-radius:6px;background:rgba(11,20,26,.05);border-left:4px solid #06cf9c}
.wb .ref .rimg{width:48px;height:62px;border-radius:4px;background-size:cover;background-position:center 20%;flex:none}
.wb .ref .rt{font-size:13px;line-height:16px;min-width:0}
.wb .ref .rt b{display:block;font-weight:500;color:var(--wa-ink);margin-bottom:2px}
.wb .ref .rt span{color:#667781;font-size:12px;display:block}
.wb .ref .rt em{font-style:normal;color:#06a07c;font-size:11.5px;display:flex;align-items:center;gap:4px;margin-top:3px}
.wbtns{background:#fff;border-radius:0 0 8px 8px;margin-top:-4px;box-shadow:0 1px .5px rgba(11,20,26,.13);overflow:hidden}
.wm.has-btns .wb{border-bottom-left-radius:0;border-bottom-right-radius:0;box-shadow:none}
.wm.has-btns{filter:drop-shadow(0 1px .5px rgba(11,20,26,.13))}
.wm.has-btns .wbtns{box-shadow:none}
.wbtn{display:flex;align-items:center;justify-content:center;gap:7px;height:41px;border-top:1px solid #e9edef;color:var(--wa-link);font-size:14.5px;font-weight:500;position:relative;overflow:hidden;width:100%;cursor:default}
.wbtn svg{width:17px;height:17px}
.wbtn.live{cursor:pointer}
.wbtn.live:hover{background:#f5f6f6}
.wbtn.live.hint::after{content:"";position:absolute;inset:4px 18%;border-radius:8px;box-shadow:0 0 0 0 rgba(11,139,209,.35);animation:hint 1.6s ease-out infinite;pointer-events:none}
@keyframes hint{0%{box-shadow:0 0 0 0 rgba(11,139,209,.40)}100%{box-shadow:0 0 0 9px rgba(11,139,209,0)}}
.wm.anim{animation:msgIn .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.wm.out.anim{transform-origin:100% 100%}
.rv-hide{display:none!important}
.wa-input{flex:none;display:flex;align-items:flex-end;gap:6px;padding:6px 6px 7px;position:relative;z-index:3;background:transparent}
.wa-field{flex:1;min-height:46px;border-radius:24px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 12px 0 12px;box-shadow:0 1px .5px rgba(11,20,26,.13);color:#8696a0}
.wa-field svg{width:23px;height:23px;color:#8696a0}
.wa-field .ph{flex:1;font-size:16px;color:#8696a0}
.wa-field .typed{flex:1;font-size:16px;color:var(--wa-ink);display:flex;align-items:center}
.wa-field .typed::after{content:"";width:2px;height:20px;background:var(--wa-green);margin-left:1px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.wa-send{width:48px;height:48px;border-radius:50%;background:var(--wa-green);display:grid;place-items:center;color:#fff;flex:none;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.wa-send svg{width:22px;height:22px}
.wa-send.live{cursor:pointer}
.wa-send.live.hint{animation:sendHint 1.6s ease-out infinite}
@keyframes sendHint{0%{box-shadow:0 0 0 0 rgba(0,168,132,.5)}100%{box-shadow:0 0 0 12px rgba(0,168,132,0)}}
/* sheets */
.wa-dim{position:absolute;inset:0;background:rgba(11,20,26,.42);z-index:10;animation:fadeIn .2s ease}
.wa-sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;z-index:11;animation:sheetUp .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;max-height:92%}
.wa-sheet.tall{top:34px}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sh-grab{width:36px;height:4px;border-radius:2px;background:#d1d7db;margin:8px auto 2px}
.sh-head{display:flex;align-items:center;gap:10px;padding:8px 14px 10px;border-bottom:1px solid #e9edef}
.sh-head svg{width:22px;height:22px;color:#54656f}
.sh-head .sh-t{flex:1;font-size:17px;font-weight:500;text-align:center;margin-right:32px}
.sh-body{flex:1;overflow-y:auto;padding:4px 0 8px;scrollbar-width:none}
.sh-row{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer;position:relative;overflow:hidden}
.sh-row:hover{background:#f5f6f6}
.sh-row .r-t{flex:1;font-size:15.5px;color:var(--wa-ink)}
.sh-row .r-t small{display:block;font-size:13px;color:#667781;margin-top:1px}
.sh-row .stars{color:#f5a623;letter-spacing:1px;margin-right:6px;font-size:15px}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #8696a0;display:grid;place-items:center;flex:none}
.radio.on{border-color:var(--wa-green)}
.radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--wa-green)}
.sh-foot{padding:10px 16px 14px;display:flex;justify-content:flex-end;align-items:center;gap:10px;border-top:1px solid #f0f2f5}
.sh-foot .fab{width:52px;height:52px}
.flow-f{padding:10px 18px 4px}
.flow-intro{font-size:14px;color:#3b4a54;line-height:1.45;margin:4px 0 14px}
.fld{position:relative;border:1.5px solid #b8c2c9;border-radius:6px;padding:15px 12px 9px;margin-bottom:14px;font-size:15px;color:var(--wa-ink)}
.fld label{position:absolute;left:9px;top:-8px;background:#fff;padding:0 4px;font-size:12px;color:#667781}
.fld.lock{background:#f7f8fa}
.fld.lock::after{content:"";position:absolute;right:11px;top:50%;width:14px;height:14px;margin-top:-7px;background:var(--lock-ic) center/contain no-repeat;opacity:.55}
.fld.sel::after{content:"";position:absolute;right:12px;top:50%;margin-top:-3px;border:5px solid transparent;border-top-color:#667781}
.flow-btn{margin:6px 18px 6px;height:46px;border-radius:24px;background:var(--wa-green);color:#fff;font-size:15.5px;font-weight:500;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.flow-btn.live{cursor:pointer}
.flow-btn.live.hint{animation:sendHint 1.6s ease-out infinite}
.flow-mgd{text-align:center;font-size:12px;color:#8696a0;padding:4px 0 12px}
.flow-mgd a{color:var(--wa-link);text-decoration:none}
/* heads-up notification (SMS OTP) */
.hun{position:absolute;left:8px;right:8px;top:4px;z-index:25;background:#f4f6fb;border-radius:20px;padding:12px 14px 10px;box-shadow:0 10px 30px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.04);animation:hunIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes hunIn{from{transform:translateY(-120%)}to{transform:none}}
.hun-top{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#5f6368}
.hun-top .appic{width:18px;height:18px;border-radius:50%;background:#1a73e8;display:grid;place-items:center}
.hun-top .appic svg{width:11px;height:11px;color:#fff}
.hun-t{font-size:14px;font-weight:500;color:#1f1f1f;margin-top:7px}
.hun-b{font-size:13.5px;color:#444746;line-height:1.35;margin-top:2px}
.hun-acts{display:flex;gap:8px;margin-top:10px}
.hun-acts button{height:32px;padding:0 14px;border-radius:16px;background:#dfe3ec;color:#1f1f1f;font-size:13px;font-weight:500;position:relative;overflow:hidden}
.hun-acts button.live{background:#c9dcfb;color:#0b3d91;cursor:pointer}
.hun-acts button.live.hint{animation:hunHint 1.6s ease-out infinite}
@keyframes hunHint{0%{box-shadow:0 0 0 0 rgba(26,115,232,.45)}100%{box-shadow:0 0 0 9px rgba(26,115,232,0)}}

/* ---------------- Instagram reel ---------------- */
.ig{flex:1;position:relative;background:#000;color:#fff;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.ig-video{position:absolute;inset:0;overflow:hidden}
.ig-layer{position:absolute;inset:0;opacity:0}
.reel-a{animation:reelA 15s linear infinite}
.reel-b{animation:reelB 15s linear infinite}
.reel-c{animation:reelC 15s linear infinite}
@keyframes reelA{0%{opacity:1}35%{opacity:1}39%{opacity:0}97%{opacity:0}100%{opacity:1}}
@keyframes reelB{0%,36%{opacity:0}40%{opacity:1}79%{opacity:1}83%{opacity:0}100%{opacity:0}}
@keyframes reelC{0%,80%{opacity:0}84%{opacity:1}98%{opacity:1}100%{opacity:0}}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,#b9aea0 0%,#c9b9a2 38%,#d7c3a4 55%,#a79a8a 100%)}
.sky svg{position:absolute;left:0;bottom:0;width:100%;height:100%}
.smog{position:absolute;inset:-10% -30%;background:radial-gradient(ellipse at 30% 42%,rgba(226,214,194,.5),rgba(226,214,194,0) 58%),radial-gradient(ellipse at 75% 64%,rgba(206,194,176,.45),rgba(206,194,176,0) 55%);animation:smog 15s ease-in-out infinite alternate}
.smog.s2{animation-duration:11s;animation-direction:alternate-reverse;opacity:.8}
@keyframes smog{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
.kb{animation:kb 15s ease-in-out infinite}
@keyframes kb{0%{transform:scale(1.02)}100%{transform:scale(1.12)}}
.reel-photo{position:absolute;inset:0;background-size:cover;background-position:center}
.reel-photo.blur{filter:blur(22px) saturate(1.2) brightness(.92);transform:scale(1.3)}
.reel-photo.main{inset:auto 0 auto 0;top:25%;height:40%;background-size:cover;background-position:center 30%;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.reel-txt{position:absolute;left:18px;right:18px;text-align:left;font:900 30px/1.02 var(--pf);letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.reel-txt small{display:block;font:500 13.5px/1.35 var(--pf);letter-spacing:0;margin-top:8px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.reel-legal{position:absolute;left:0;right:0;bottom:262px;text-align:center;font-size:9.5px;color:rgba(255,255,255,.78);letter-spacing:.01em;text-shadow:0 1px 3px rgba(0,0,0,.6);z-index:4}
.endcard{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#fff4e2 0%,#ffd9a6 55%,#f6a55a 100%);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:70px;color:#1b2b4b}
.endcard img{width:184px;filter:drop-shadow(0 16px 20px rgba(120,60,0,.35));transform:rotate(-4deg)}
.endcard .ec-t{font:900 26px/1.05 var(--pf);letter-spacing:-.02em;margin-top:18px;text-align:center;color:#b71c1c}
.endcard .ec-s{font:500 14px/1.35 var(--pf);margin-top:6px;text-align:center;color:#3a2a14;padding:0 30px}
.ig-grad{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(0deg,rgba(0,0,0,.7),rgba(0,0,0,0));pointer-events:none;z-index:2}
.ig-top{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:8px 16px 0}
.ig-top b{font-size:22px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:4px}
.ig-top svg{width:24px;height:24px}
.ig-right{position:absolute;right:10px;bottom:104px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:17px;font-size:12px;font-weight:500}
.ig-right div{display:flex;flex-direction:column;align-items:center;gap:3px}
.ig-right svg{width:27px;height:27px}
.ig-aud{width:28px;height:28px;border-radius:7px;border:2px solid #fff;background-size:cover;background-position:center}
.ig-bot{position:absolute;left:14px;right:62px;bottom:72px;z-index:5}
.ig-acct{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.ig-acct .igav{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.ig-acct .igav svg{width:25px;height:25px}
.ig-acct .spons{display:block;font-size:11.5px;font-weight:400;opacity:.9}
.ig-acct .follow{margin-left:6px;height:26px;padding:0 10px;border:1px solid rgba(255,255,255,.7);border-radius:8px;font-size:12.5px;font-weight:600;display:grid;place-items:center}
.ig-cta{margin-top:10px;width:100%;height:40px;border-radius:9px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:14px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:ctaBlue 15s linear infinite;position:relative;overflow:hidden;cursor:pointer}
.ig-cta svg{width:18px;height:18px}
.ig-cta .chev{margin-left:auto}
.ig-cta.hint{box-shadow:0 0 0 0 rgba(0,149,246,.6);animation:ctaBlue 15s linear infinite,ctaHint 1.6s ease-out infinite}
@keyframes ctaBlue{0%,14%{background:rgba(255,255,255,.22)}18%,100%{background:#0095f6}}
@keyframes ctaHint{0%{box-shadow:0 0 0 0 rgba(0,149,246,.65)}100%{box-shadow:0 0 0 11px rgba(0,149,246,0)}}
.ig-cap{font-size:13px;line-height:1.35;margin-top:9px;opacity:.95}
.ig-cap b{font-weight:600}
.ig-aud-l{font-size:12px;margin-top:6px;display:flex;align-items:center;gap:5px;opacity:.95}
.ig-aud-l svg{width:13px;height:13px}
.ig-prog{position:absolute;left:0;right:0;bottom:56px;height:2px;background:rgba(255,255,255,.25);z-index:6}
.ig-prog i{display:block;height:100%;background:#fff;width:0;animation:igp 15s linear infinite}
@keyframes igp{from{width:0}to{width:100%}}
.ig-nav{position:absolute;left:0;right:0;bottom:0;height:56px;background:#000;z-index:6;display:flex;align-items:center;justify-content:space-around;padding:0 8px;border-top:1px solid rgba(255,255,255,.08)}
.ig-nav svg{width:25px;height:25px}
.ig-nav .me{width:26px;height:26px;border-radius:50%;background:url() center/cover,#c9a58b;box-shadow:0 0 0 1.5px #fff}

/* ---------------- Camera / QR ---------------- */
.cam{flex:1;position:relative;background:#111;overflow:hidden;color:#fff;display:flex;flex-direction:column}
.cam-view{position:absolute;inset:0 0 150px 0;background:radial-gradient(ellipse at 50% 40%,#9c7a58,#4a3526 70%,#2a1e16);overflow:hidden}
.cam-view .table{position:absolute;left:-10%;right:-10%;bottom:-6%;height:46%;background:linear-gradient(180deg,#6b4a30,#4e3421);transform:perspective(400px) rotateX(38deg);transform-origin:50% 100%}
.cam-pack{position:absolute;left:50%;top:44%;width:230px;margin-left:-115px;transform:translateY(-50%) rotate(-3deg);filter:drop-shadow(0 18px 18px rgba(0,0,0,.45))}
.cam-pack img{width:100%;display:block}
.qr-sticker{position:absolute;right:14px;bottom:10px;width:70px;background:#fff;border-radius:6px;padding:5px 5px 3px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.qr-sticker svg{width:100%;height:60px;display:block}
.qr-sticker span{display:block;font:500 4.6px/1.25 var(--pf);color:#333;text-align:center;margin-top:2px}
.qr-frame{position:absolute;border:3px solid #ffd600;border-radius:12px;animation:qrf 1.2s ease-in-out infinite alternate}
@keyframes qrf{from{transform:scale(1)}to{transform:scale(1.05)}}
.cam-top{position:relative;z-index:3;display:flex;justify-content:space-between;padding:10px 18px;color:#fff}
.cam-top svg{width:22px;height:22px}
.cam-link{position:absolute;left:18px;right:18px;bottom:176px;z-index:4;background:#fff;color:#1f1f1f;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:11px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:fadeUp .45s ease both}
.cam-link .wa-g{width:36px;height:36px;border-radius:50%;background:#25d366;display:grid;place-items:center;flex:none}
.cam-link .wa-g svg{width:22px;height:22px;color:#fff}
.cam-link .cl-t{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.cam-link .cl-t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam-link .cl-t span{color:#5f6368;font-size:12px}
.cam-open{height:34px;padding:0 14px;border-radius:17px;background:#0b57d0;color:#fff;font-size:13px;font-weight:500;position:relative;overflow:hidden}
.cam-open.live{cursor:pointer}
.cam-open.live.hint{animation:hunHint 1.6s ease-out infinite}
.cam-bot{position:absolute;left:0;right:0;bottom:0;height:150px;background:#0c0c0c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.cam-modes{display:flex;gap:18px;font-size:12.5px;color:#aaa;font-weight:500}
.cam-modes .on{color:#fff;background:rgba(255,255,255,.14);padding:3px 10px;border-radius:12px;margin:-3px -10px}
.cam-shutter{display:flex;align-items:center;justify-content:space-between;width:230px}
.cam-shutter .th{width:40px;height:40px;border-radius:50%;background:#2d2d2d center/cover}
.cam-shutter .sh{width:66px;height:66px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.cam-shutter .sh i{width:52px;height:52px;border-radius:50%;background:#fff}
.cam-shutter .fl{width:40px;height:40px;border-radius:50%;background:#2d2d2d;display:grid;place-items:center}
.cam-shutter .fl svg{width:20px;height:20px;color:#fff}

/* ---------------- Platform: trace / journey ---------------- */
.trace{list-style:none;margin:0;padding:6px 0 4px}
.tr{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 10px;padding:7px 14px;position:relative}
.tr::before{content:"";position:absolute;left:24px;top:24px;bottom:-8px;width:2px;background:#e3e8f0}
.tr:last-child::before{display:none}
.tr.done::before{background:#bfe9d7}
.tr .tr-i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid #cfd8e5;position:relative;z-index:1;margin-top:1px}
.tr.done .tr-i{background:var(--green);border-color:var(--green);color:#fff}
.tr.done .tr-i svg{width:12px;height:12px;stroke-width:3}
.tr.run .tr-i{border-color:var(--blue);background:#fff}
.tr.run .tr-i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pulse 1.2s infinite}
.tr.wait .tr-i{border-color:var(--amber)}
.tr.wait .tr-i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber)}
.tr .tr-t{font-size:12.8px;font-weight:600;color:var(--fg);line-height:1.35}
.tr.todo .tr-t{color:var(--muted);font-weight:500}
.tr .tr-d{grid-column:2/4;font-size:11.5px;color:var(--muted);line-height:1.4}
.tr .tr-ts{font:500 10.5px/1.6 var(--mono);color:var(--muted-2);white-space:nowrap}
.tr.flash{animation:trFlash 1.8s ease}
@keyframes trFlash{0%{background:#fff8e1}100%{background:transparent}}
.consent-rec{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12px}
.consent-rec dt{color:var(--muted)}
.consent-rec dd{margin:0;font-weight:500}
.hash{font:500 11px var(--mono);color:var(--fg-2);background:#f3f5f9;padding:1px 5px;border-radius:4px}

/* campaign card */
.cmp-hero{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cmp-thumb{width:62px;height:98px;border-radius:8px;background-size:cover;background-position:center 20%;flex:none;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.cmp-thumb span{position:absolute;left:5px;bottom:5px;font-size:9.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.55);padding:1px 5px;border-radius:4px}
.cmp-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-bottom:1px solid var(--line)}
.cmp-kpis div{padding:9px 12px;border-right:1px solid var(--line)}
.cmp-kpis div:last-child{border-right:0}
.cmp-kpis b{display:block;font-size:16px;font-weight:650;letter-spacing:-.01em}
.cmp-kpis span{font-size:10.5px;color:var(--muted);font-weight:500}
.cmp-kpis em{font-style:normal;font-size:10.5px;color:var(--green-ink);font-weight:600;margin-left:4px}

/* order card */
.order{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0}
.order .o-l{padding:12px 14px;border-right:1px solid var(--line);display:flex;gap:12px}
.order .o-l img{width:58px;height:56px;object-fit:contain;flex:none}
.order .o-r{padding:12px 14px}
.tl-h{display:grid;grid-template-columns:repeat(5,1fr);padding:12px 14px 14px;border-top:1px solid var(--line);position:relative}
.tl-h .st{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;padding:0 2px}
.tl-h .st::before{content:"";position:absolute;top:9px;left:-50%;right:50%;height:3px;background:#e2e8f0}
.tl-h .st:first-child::before{display:none}
.tl-h .st.done::before,.tl-h .st.cur::before{background:var(--green)}
.tl-h .st .dot{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #cfd8e5;position:relative;z-index:1;display:grid;place-items:center}
.tl-h .st.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.tl-h .st.done .dot svg{width:11px;height:11px;stroke-width:3}
.tl-h .st.cur .dot{border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,130,246,.18)}
.tl-h .st.cur .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pulse 1.2s infinite}
.tl-h .st b{font-size:11.5px;font-weight:600;margin-top:6px;line-height:1.25}
.tl-h .st span{font-size:10.5px;color:var(--muted);line-height:1.3;margin-top:1px}
.tl-h .st.todo b{color:var(--muted)}
.copyable{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12px;font-weight:500}
.copyable svg{width:12px;height:12px;color:var(--muted)}

/* rule builder */
.rule{padding:0}
.rule-nl{padding:12px 14px;border-bottom:1px solid var(--line);font-size:16.5px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#fbfcfe,#fff)}
.rule-nl .ic{width:18px;height:18px;color:var(--primary)}
.rule-nl code{font:600 15px var(--mono);background:var(--primary-soft);color:var(--primary);padding:1px 6px;border-radius:5px}
.rblk{padding:10px 14px 10px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:start}
.rblk:last-of-type{border-bottom:0}
.rtag{font-size:10px;font-weight:750;letter-spacing:.08em;padding:4px 0;border-radius:5px;text-align:center;margin-top:1px}
.rtag.when{background:#fff0e5;color:#c2410c}
.rtag.if{background:var(--blue-soft);color:var(--blue-ink)}
.rtag.and{background:#eef1f6;color:#475569}
.rtag.then{background:var(--green-soft);color:var(--green-ink)}
.rrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12.8px;line-height:1.5;margin-bottom:5px}
.rrow:last-child{margin-bottom:0}
.tok{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 8px;border-radius:6px;border:1px solid var(--line-2);background:#fff;font-size:12.3px;font-weight:600;color:var(--fg);white-space:nowrap}
.tok.op{font-family:var(--mono);background:#f6f8fb}
.tok.val{background:var(--primary-soft);border-color:var(--primary-soft-2);color:var(--primary)}
.tok .ic{width:13px;height:13px}
.rsub{font-size:11.5px;color:var(--muted)}
.aqi-list{display:grid;grid-template-columns:1fr auto auto;gap:5px 10px;font-size:12px;align-items:center}
.aqi-list .pin{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-right:6px}
.aqi-b{font-weight:700;font-size:11.5px;padding:2px 7px;border-radius:5px;text-align:center;min-width:40px}
.aqi-vp{background:#fde2e1;color:#b42318}
.aqi-sv{background:#f5dce6;color:#8a1538}
.aqi-p{background:#ffedd5;color:#b45309}
.run-strip{display:flex;align-items:center;gap:14px;padding:10px 14px;background:#fafbfd;border-top:1px solid var(--line);font-size:12px;color:var(--fg-2);flex-wrap:wrap}
.run-strip b{font-weight:650;color:var(--fg)}

/* analytics */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{padding:11px 13px}
.kpi .kl{font-size:11.5px;color:var(--muted);font-weight:500}
.kpi .kv2{font-size:21px;font-weight:650;letter-spacing:-.02em;margin-top:2px;line-height:1.2}
.kpi .kd{font-size:11px;color:var(--muted);margin-top:1px}
.an-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;min-height:0}
.fun{padding:6px 14px 12px}
.fun-row{display:grid;grid-template-columns:minmax(118px,.9fr) minmax(0,2.2fr) 58px;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid #f0f3f7;position:relative}
.fun-row:last-child{border-bottom:0}
.fun-row .fl-n{font-size:12.5px;font-weight:600;line-height:1.25}
.fun-row .fl-n small{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.fun-row .fl-v{font-size:16px;font-weight:650;letter-spacing:-.01em;margin-bottom:4px;display:flex;align-items:baseline;gap:8px}
.fun-row .fl-v span{font-size:11px;font-weight:500;color:var(--muted)}
.fbar{height:14px;background:#eaf0fa;border-radius:4px;overflow:hidden;display:flex;gap:2px;position:relative}
.fbar i{display:block;height:100%;background:#3a63c9;border-radius:0 4px 4px 0;transform-origin:0 50%;animation:barIn .9s cubic-bezier(.2,.8,.2,1) both}
.fbar i.s2{background:#a063e8;border-radius:0 4px 4px 0}
.fbar i.s1{border-radius:0}
@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fun-row .fl-p{font-size:12px;font-weight:650;text-align:right;color:var(--fg-2)}
.fun-row .fl-p small{display:block;font-size:10px;color:var(--muted);font-weight:500}
.fun-div{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-2);padding:8px 0 2px}
.fun-div::after{content:"";flex:1;height:1px;background:var(--line)}
.fun-leg{display:flex;gap:14px;font-size:11.5px;color:var(--fg-2);padding:0 14px 10px;flex-wrap:wrap}
.fun-leg span{display:inline-flex;align-items:center;gap:6px}
.fun-leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tip{position:fixed;z-index:100;pointer-events:none;background:#0f1b33;color:#fff;font-size:11.5px;line-height:1.4;padding:7px 9px;border-radius:7px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transition:opacity .12s;max-width:240px}
.tip.on{opacity:1}
.ins{display:flex;flex-direction:column}
.ins-i{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:start}
.ins-i:last-child{border-bottom:0}
.ins-i .ii{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.ins-i .ii .ic{width:16px;height:16px}
.ins-i p{margin:0;font-size:12.8px;line-height:1.45;font-weight:500;color:var(--fg)}
.ins-i p b{font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flt{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);background:#fff;font-size:12px;font-weight:600;color:var(--fg-2)}
.flt .ic{width:14px;height:14px;color:var(--muted)}
.flt span{color:var(--muted);font-weight:500}

/* sources */
.imp-head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.file-ic{width:38px;height:44px;border-radius:6px;background:#e7f6ec;color:#15803d;display:grid;place-items:center;flex:none;position:relative;font:700 9px var(--font)}
.file-ic .ic{width:18px;height:18px}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-bottom:1px solid var(--line)}
.pp{padding:11px 13px;border-right:1px solid var(--line);position:relative}
.pp:last-child{border-right:0}
.pp .pp-t{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted)}
.pp .pp-t .pi{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:#e2e8f0;color:#fff}
.pp .pp-t .pi svg{width:10px;height:10px;stroke-width:3}
.pp.done .pp-t{color:var(--green-ink)}
.pp.done .pp-t .pi{background:var(--green)}
.pp.run .pp-t{color:var(--blue-ink)}
.pp.run .pp-t .pi{background:#fff;border:2px solid var(--blue)}
.pp .pp-v{font-size:19px;font-weight:650;letter-spacing:-.02em;margin-top:3px}
.pp .pp-s{font-size:11px;color:var(--muted);line-height:1.35}
.pp.todo .pp-v{color:var(--muted-2)}
.imp-prog{height:3px;background:#e8edf4;position:relative;overflow:hidden}
.imp-prog i{position:absolute;left:0;top:0;bottom:0;background:var(--primary);animation:impP 2.4s cubic-bezier(.3,.6,.3,1) both}
@keyframes impP{from{width:0}to{width:100%}}
.map-row{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px}
.map{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:7px;background:#f6f8fb;border:1px solid var(--line);font-size:11.5px;color:var(--fg-2);white-space:nowrap}
.map b{font-weight:600;color:var(--fg)}
.map code{font:500 11px var(--mono);color:var(--primary)}
.map .ic{width:12px;height:12px;color:var(--muted-2)}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-size:10.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);background:#fafbfd;white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid #eef2f7;white-space:nowrap;color:var(--fg)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td .sub{display:block;font-size:10.5px;color:var(--muted)}
.tbl tr.hl td{background:#f5f9ff}
.tbl .mini{width:74px;display:inline-block;vertical-align:middle;margin-right:6px}

/* magicflow canvas */
.mf{flex:1;position:relative;border-radius:var(--r-lg);border:1px solid var(--line);background:#f8fafc;overflow:hidden;box-shadow:var(--sh-1);min-height:0}
.mf-grid{position:absolute;inset:0;background-image:radial-gradient(#cfd8e3 1.1px,transparent 1.2px);background-size:18px 18px}
.mf-tools{position:absolute;top:10px;right:10px;z-index:4;display:flex;gap:6px;align-items:center}
.mf-tools .seg{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;background:#fff;border:1px solid var(--line-2);font-size:12px;font-weight:600;box-shadow:var(--sh-1)}
.mf-tools .tgl{width:28px;height:16px;border-radius:9px;background:var(--primary);position:relative}
.mf-tools .tgl::after{content:"";position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff}
.mf-left{position:absolute;left:10px;top:10px;z-index:4;display:flex;gap:6px;align-items:center}
.mf-zoom{position:absolute;left:10px;bottom:10px;z-index:4;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;box-shadow:var(--sh-1)}
.mf-zoom span{width:28px;height:28px;display:grid;place-items:center;border-bottom:1px solid var(--line);color:var(--fg-2)}
.mf-zoom span:last-child{border-bottom:0}
.mf-zoom .ic{width:14px;height:14px}
.mf-mini{position:absolute;right:10px;bottom:10px;z-index:4;width:150px;height:94px;background:#fff;border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--sh-1);overflow:hidden}
.mf-fit{position:absolute;inset:44px 12px 12px 12px}
.mf-canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.mf-edges{position:absolute;left:0;top:0;overflow:visible}
.mf-edges path.e{fill:none;stroke:var(--indigo);stroke-width:2;stroke-linecap:round}
.mf-edges path.e.flow{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.mf-elabel{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid #dcdffb;color:#4338ca;font-size:11px;font-weight:650;padding:2px 7px;border-radius:999px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.nd{position:absolute;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);font-size:12px}
.nd.nwa{border-color:#bbf7d0}
.nd.ai{border-color:#ddd6fe}
.nd.ful{border-color:#fde68a}
.nd.sel{box-shadow:0 0 0 2px rgba(34,197,94,.35),0 8px 20px rgba(15,23,42,.08)}
.nd-h{display:flex;align-items:center;gap:8px;padding:9px 11px 7px}
.nd-ic{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:#fff;flex:none}
.nd-ic svg{width:12px;height:12px}
.nd-t{font-size:13.5px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd-b{padding:0 11px 10px;color:var(--muted);font-size:12px;line-height:1.4}
.nd-q{color:var(--fg-2);background:#f8fafc;border:1px solid #eef2f7;border-radius:7px;padding:6px 8px;margin-bottom:7px;font-size:11.8px;line-height:1.4}
.nd-q .var{color:#7c3aed;background:#f3e8ff;border-radius:4px;padding:0 3px;font-family:var(--mono);font-size:10.5px}
.nd-btn{position:relative;display:flex;align-items:center;justify-content:space-between;height:29px;padding:0 9px;border:1px solid #e2e8f0;border-radius:7px;margin-top:5px;color:var(--fg);font-size:12px;font-weight:500;background:#fff}
.nd-btn .ctr{font-size:10.5px;font-weight:650;color:#15803d;background:#ecfdf3;padding:1px 6px;border-radius:5px}
.nd-btn.to .ctr{color:#b45309;background:#fef3c7}
.nd-btn.ai-o .ctr{color:#6d28d9;background:#f3e8ff}
.hdl{position:absolute;width:11px;height:11px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.hdl.r{right:-6px;top:50%;margin-top:-5.5px}
.hdl.l{left:-6px;top:50%;margin-top:-5.5px}
.hdl.g{background:#22c55e}.hdl.v{background:#8b5cf6}.hdl.a{background:#f59e0b}.hdl.s{background:#94a3b8}.hdl.n{background:#0a3578}
.nd-stat{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.nd-stat span{font-size:11px;font-weight:600;color:var(--fg-2);background:#f1f5f9;padding:2px 6px;border-radius:5px}
.nd-row{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--fg-2);font-size:11.8px}
.nd-row .ic{width:12px;height:12px;color:var(--muted-2)}

/* call panel */
.call{display:flex;flex-direction:column;min-height:0}
.call-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.call-av{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#4f46e5);display:grid;place-items:center;color:#fff;flex:none}
.call-av .ic{width:18px;height:18px}
.wave{display:flex;align-items:center;gap:2px;height:22px}
.wave i{width:3px;border-radius:2px;background:#8b5cf6;animation:wave 1s ease-in-out infinite}
@keyframes wave{0%,100%{height:4px}50%{height:20px}}
.call-body{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;background:#fbfbfe}
.tb{max-width:88%;padding:8px 11px;border-radius:12px;font-size:12.8px;line-height:1.42;position:relative}
.tb .who{display:block;font-size:10.5px;font-weight:650;letter-spacing:.02em;margin-bottom:2px}
.tb.ai{align-self:flex-start;background:#f1ecfe;color:#2e1a61;border-top-left-radius:4px}
.tb.ai .who{color:#6d28d9}
.tb.dr{align-self:flex-end;background:#fff;border:1px solid var(--line);border-top-right-radius:4px}
.tb.dr .who{color:var(--muted)}
.tb.anim{animation:fadeUp .35s ease both}
.extract{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:#fff}
.call-status{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}

/* people / profile */
.prof{display:flex;gap:14px;align-items:center;padding:14px}
.prof .pav{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;display:grid;place-items:center;font-size:19px;font-weight:700;flex:none}
.prof h2{margin:0;font-size:18px;font-weight:650;letter-spacing:-.015em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prof .pm{font-size:12.5px;color:var(--muted);margin-top:2px}
.prof .pchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.big-stat{background:linear-gradient(135deg,#0b2e6e,#1b4fa0);color:#fff;border:0}
.big-stat .kl{color:#c9d7f0}
.big-stat .kd{color:#c9d7f0}
.big-stat .kv2{font-size:28px}
.pat-st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600}
.pat-st i{width:6px;height:6px;border-radius:50%;background:var(--green)}

/* command palette */
.cmdk-bg{position:fixed;inset:0;background:rgba(10,20,40,.35);z-index:200;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;backdrop-filter:blur(2px)}
.cmdk-bg.on{display:flex;animation:fadeIn .15s ease;-webkit-backdrop-filter:blur(2px)}
.cmdk{width:min(620px,92vw);background:#fff;border-radius:14px;box-shadow:0 30px 80px rgba(10,20,40,.35);overflow:hidden}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmdk-in .ic{color:var(--muted)}
.cmdk-in input{flex:1;border:0;outline:0;font:500 15px var(--font);color:var(--fg);background:transparent}
.cmdk-l{max-height:52vh;overflow-y:auto;padding:6px}
.cmdk-g{font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-2);padding:8px 10px 4px}
.cmdk-it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.cmdk-it .ic{width:16px;height:16px;color:var(--muted)}
.cmdk-it .n{font-family:var(--mono);font-size:11px;color:var(--muted-2);margin-left:auto}
.cmdk-it.on{background:var(--primary-soft);color:var(--primary)}
.cmdk-it.on .ic{color:var(--primary)}

/* ---------------- Reveal helpers ---------------- */
.pop{animation:pop .42s cubic-bezier(.2,.8,.2,1.1) both}
.card.anim{animation:fadeUp .4s ease both}
.idr.flash,.elg.flash,.tbl tr.flash td{animation:trFlash 1.8s ease}

/* ---------------- Web: Chrome on Android ---------------- */
.ph-app.sw{animation:appIn .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes appIn{from{opacity:.2;transform:scale(.94)}to{opacity:1;transform:none}}
.cr{flex:1;display:flex;flex-direction:column;min-height:0;background:#fff;position:relative;font-family:var(--pf);color:#1f1f1f}
.cr-bar{flex:none;height:54px;display:flex;align-items:center;gap:2px;padding:0 2px 0 4px;background:#fff;position:relative;z-index:4}
.cr-ic{width:38px;height:38px;display:grid;place-items:center;color:#444746;flex:none}
.cr-ic svg{width:22px;height:22px}
.cr-omni{flex:1;min-width:0;height:40px;border-radius:20px;background:#edf1f8;display:flex;align-items:center;gap:9px;padding:0 12px 0 11px}
.cr-omni svg{width:18px;height:18px;color:#444746;flex:none}
.cr-url{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;color:#1f1f1f;letter-spacing:.005em}
.cr-url i{font-style:normal;color:#747775}
.cr-tabs{width:21px;height:21px;border:2px solid #444746;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#444746;flex:none;margin:0 8px 0 9px}
.cr-load{position:absolute;left:0;right:0;top:54px;height:3px;z-index:5;overflow:hidden;pointer-events:none}
.cr-load i{display:block;height:100%;background:#1a73e8;animation:crLoad .9s ease-out both}
@keyframes crLoad{0%{width:0;opacity:1}75%{width:100%;opacity:1}100%{width:100%;opacity:0}}
.cr-page{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;position:relative;background:#fff}
.cr-page::-webkit-scrollbar{display:none}

/* search results */
.serp{padding:4px 0 14px;font-family:Arial,var(--pf);color:#202124}
.serp-box{margin:4px 12px 0;height:46px;border-radius:23px;box-shadow:0 1px 6px rgba(32,33,36,.26);display:flex;align-items:center;padding:0 4px 0 18px;gap:2px;background:#fff}
.serp-box .sq{flex:1;min-width:0;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.serp-box .si{width:34px;height:34px;display:grid;place-items:center;color:#70757a;flex:none}
.serp-box .si svg{width:21px;height:21px}
.serp-box .sdiv{width:1px;height:24px;background:#dadce0;margin:0 2px;flex:none}
.serp-tabs{display:flex;gap:18px;padding:12px 16px 0;border-bottom:1px solid #ebebeb;font-size:14px;color:#5f6368;white-space:nowrap;overflow:hidden}
.serp-tabs span{padding-bottom:10px;flex:none}
.serp-tabs .on{color:#202124;font-weight:700;border-bottom:3px solid #202124;padding-bottom:7px}
.sres{padding:13px 16px 8px;border-bottom:8px solid #f1f3f4}
.sres.org{border-bottom:0}
.sp-lbl{font-size:14px;font-weight:700;margin-bottom:10px}
.sr-src{display:flex;align-items:center;gap:10px}
.sr-src .fav{width:28px;height:28px;border-radius:50%;border:1px solid #ecedef;display:grid;place-items:center;background:#fff;flex:none}
.sr-site{flex:1;min-width:0;line-height:1.3}
.sr-site b{display:block;font-size:14px;font-weight:400;color:#202124}
.sr-site span{display:block;font-size:12px;color:#4d5156;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-src .k3{color:#70757a;width:22px;display:grid;place-items:center;flex:none}
.sr-src .k3 svg{width:18px;height:18px}
.sr-h{margin-top:9px;font-size:19px;line-height:25px;color:#1a0dab;cursor:pointer;border-radius:6px;position:relative}
.sr-h.hint{animation:linkHint 1.6s ease-out infinite}
@keyframes linkHint{0%{box-shadow:0 0 0 0 rgba(26,13,171,.28)}100%{box-shadow:0 0 0 8px rgba(26,13,171,0)}}
.sr-body{display:flex;gap:12px;align-items:flex-start}
.sr-d{margin-top:5px;font-size:14px;line-height:21px;color:#4d5156}
.sr-img{width:84px;height:84px;border-radius:10px;background:linear-gradient(135deg,#fff5e6,#ffd9a8);display:grid;place-items:center;flex:none;margin-top:12px}
.sr-img img{width:74px}
.sr-sl{margin:8px -16px 0}
.sr-sl div{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 16px;border-top:1px solid #ecedef;font-size:15.5px;color:#1a0dab;cursor:pointer;position:relative;overflow:hidden}
.sr-sl svg{width:20px;height:20px;color:#70757a}

/* RV landing page */
.lp{min-height:100%;display:flex;flex-direction:column;background:#f5f6fa;font-family:var(--pf)}
.lp-head{height:50px;flex:none;display:flex;align-items:center;gap:0;padding:0 6px 0 14px;background:#fff;border-bottom:1px solid #eceff4}
.lp-head .lp-logo{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.lp-head .lp-ic{width:36px;height:36px;display:grid;place-items:center;color:#5B1F52}
.lp-head .lp-ic svg{width:22px;height:22px}
.lp-hero{position:relative;padding:13px 16px 32px;background:linear-gradient(135deg,#fdf0ec 0%,#f5d5d2 100%);overflow:hidden;flex:none}
.lp-hero .k{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:#a8436a}
.lp-hero h2{margin:5px 0 4px;font-size:22px;line-height:1.08;font-weight:800;color:#5B1F52;letter-spacing:-.01em;max-width:180px}
.lp-hero p{margin:0;font-size:12px;line-height:1.38;color:#6d4c62;max-width:176px}
.lp-hero img{position:absolute;right:-6px;bottom:20px;width:136px;filter:drop-shadow(0 10px 12px rgba(120,60,0,.28));transform:rotate(-4deg)}
.lp-hero .pill{display:inline-flex;margin-top:9px;height:22px;align-items:center;padding:0 9px;border-radius:11px;background:#fff;color:#5B1F52;font-size:11px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lp-mini{display:flex;align-items:center;gap:10px;padding:10px 14px 30px;background:linear-gradient(135deg,#fdf0ec 0%,#f5d5d2 100%);flex:none}
.lp-mini img{width:54px;transform:rotate(-4deg);filter:drop-shadow(0 4px 6px rgba(120,60,0,.25))}
.lp-mini b{display:block;font-size:15px;color:#5B1F52;font-weight:800}
.lp-mini span{display:block;font-size:11.5px;color:#6d4c62}
.lp-mini em{display:block;font-style:normal;font-size:9.8px;color:#8d6f82;margin-top:1px}
.lp-foot{margin-top:auto;padding:14px 16px 16px;font-size:10.5px;color:#6b7280;line-height:1.5;text-align:center}
.lp-foot b{font-weight:600;color:#4b5563}
.lp-foot .pw{display:inline-flex;align-items:center;gap:5px;margin-top:5px;color:#9ca3af}
.lp-foot .pw-logo{height:9px;width:auto;color:#9ca3af}

/* embedded Freestand form */
.fsf{margin:-22px 12px 0;position:relative;z-index:1;background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(91,31,82,.12),0 1px 3px rgba(91,31,82,.08);padding:13px 14px 14px;color:#111827}
.fsf-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.fsf-step{font-size:10.5px;font-weight:700;letter-spacing:.07em;color:#6b7280;text-transform:uppercase}
.fsf-dots{display:flex;gap:4px}
.fsf-dots i{width:16px;height:4px;border-radius:2px;background:#e5e7eb}
.fsf-dots i.d{background:#5B1F52}
.fsf-dots i.c{background:#B8446A}
.fsf h3{margin:0 0 3px;font-size:17.5px;font-weight:700;color:#5B1F52;letter-spacing:-.005em}
.fsf .lead{margin:0 0 13px;font-size:12.8px;color:#4b5563;line-height:1.42}
.fsf .lnk{color:#5B1F52;font-weight:600;text-decoration:underline}
.wf{position:relative;border:1.5px solid #cfd6e0;border-radius:10px;padding:0 12px;height:48px;display:flex;align-items:center;margin-bottom:12px;background:#fff}
.wf label{position:absolute;left:9px;top:-8px;padding:0 4px;background:#fff;font-size:11.5px;color:#6b7280;line-height:14px}
.wf .wf-in{flex:1;min-width:0;display:flex;align-items:center;font-size:15px;color:#111827;white-space:nowrap;overflow:hidden}
.wf .fp{color:#9ca3af}
.wf .wf-pre{padding-right:9px;margin-right:9px;border-right:1px solid #e5e7eb;color:#374151;font-weight:500}
.wf.focus{border-color:#5B1F52;box-shadow:0 0 0 3px rgba(91,31,82,.1)}
.wf.lock{background:#f7f8fa;color:#4b5563}
.wf.lock::after{content:"";width:14px;height:14px;margin-left:8px;background:var(--lock-ic) center/contain no-repeat;opacity:.55;flex:none}
.wf.lock label{background:linear-gradient(#fff 50%,#f7f8fa 50%)}
.wf-wa{margin-left:8px;width:22px;height:22px;border-radius:50%;background:#25d366;display:grid;place-items:center;flex:none}
.wf-wa svg{width:13px;height:13px;color:#fff}
.typein{display:inline-block;animation:typeIn .75s steps(14,end) both}
@keyframes typeIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.wchk{display:flex;gap:9px;align-items:flex-start;font-size:11.6px;line-height:1.45;color:#4b5563;margin:0 0 13px}
.wchk .bx{width:18px;height:18px;border-radius:4px;border:1.8px solid #9ca3af;flex:none;margin-top:1px;position:relative}
.wchk .bx .on{position:absolute;inset:-1.8px;border-radius:4px;background:#5B1F52;display:grid;place-items:center;color:#fff}
.wchk .bx .on svg{width:14px;height:14px}
.wchk a{color:#5B1F52;font-weight:600;text-decoration:underline}
.wcta{height:46px;border-radius:12px;background:#B8446A;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;position:relative;overflow:hidden;cursor:default;letter-spacing:.005em}
.wcta svg{width:19px;height:19px;flex:none}
.wcta.off{background:#e5e7eb;color:#9ca3af}
.wcta.live{cursor:pointer}
.wcta.live.hint{animation:ctaRed 1.6s ease-out infinite}
@keyframes ctaRed{0%{box-shadow:0 0 0 0 rgba(184,68,106,.45)}100%{box-shadow:0 0 0 10px rgba(184,68,106,0)}}
.wcta.wgreen{background:#1faa53}
.wcta.wgreen.live.hint{animation:sendHint 1.6s ease-out infinite}
.wcta.ghost{background:#fff;color:#5B1F52;border:1.5px solid #cfd6e0}
.wcta+.wcta{margin-top:8px}
/* OTP */
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:0 0 11px}
.otp span{height:50px;border:1.5px solid #cfd6e0;border-radius:10px;display:grid;place-items:center;font-size:22px;font-weight:600;color:#111827;position:relative;background:#fff}
.otp span.cur{border-color:#5B1F52;box-shadow:0 0 0 3px rgba(91,31,82,.1)}
.otp span.cur::after{content:"";width:2px;height:22px;background:#5B1F52;animation:caret 1s steps(1) infinite}
.otp.ok span{border-color:#16a34a;color:#166534;background:#f0fdf4}
.otp-row{display:flex;justify-content:space-between;font-size:12px;color:#6b7280;margin-bottom:11px}
.otp-row a{color:#5B1F52;font-weight:600}
.wa-tip{display:flex;gap:9px;align-items:center;padding:9px 10px;border-radius:10px;background:#effaf3;color:#14532d;font-size:12px;line-height:1.38;margin-bottom:12px}
.wa-tip .g{width:26px;height:26px;border-radius:50%;background:#25d366;display:grid;place-items:center;flex:none}
.wa-tip .g svg{width:15px;height:15px;color:#fff}
.v-ok{display:flex;align-items:center;gap:7px;justify-content:center;color:#15803d;font-weight:600;font-size:14px;margin:0 0 12px}
.v-ok svg{width:20px;height:20px}
/* Gboard */
.gb{position:absolute;left:0;right:0;bottom:0;background:#e8eaf0;padding:4px 6px 8px;z-index:6;animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
.gb-sug{height:44px;display:flex;align-items:center;gap:10px;padding:0 4px 4px}
.gb-clip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:17px;background:#fff;color:#1f1f1f;font-size:15px;font-weight:500;letter-spacing:.08em;position:relative;overflow:hidden;box-shadow:0 1px 1px rgba(0,0,0,.08);cursor:pointer}
.gb-clip svg{width:17px;height:17px;color:#444746}
.gb-clip.hint{animation:hunHint 1.6s ease-out infinite}
.gb-lbl{font-size:11.5px;color:#5f6368}
.gb-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gb-keys span{height:46px;border-radius:8px;background:#fff;display:grid;place-items:center;font-size:21px;color:#1f1f1f;box-shadow:0 1px 1px rgba(0,0,0,.1);position:relative;overflow:hidden;cursor:pointer}
.gb-keys span.fn{background:#d5d9e2;font-size:17px}
.gb-keys span.go{background:#c2d6f7;color:#0b3d91}
.gb-keys svg{width:22px;height:22px}
/* WhatsApp heads-up over Chrome */
.hun.wa-n{cursor:pointer;padding-bottom:9px}
.hun.wa-n.hint{animation:hunIn .45s cubic-bezier(.2,.8,.2,1) both,waHunHint 1.6s ease-out .5s infinite}
@keyframes waHunHint{0%{box-shadow:0 10px 30px rgba(0,0,0,.28),0 0 0 0 rgba(37,211,102,.55)}100%{box-shadow:0 10px 30px rgba(0,0,0,.28),0 0 0 10px rgba(37,211,102,0)}}
.hun-top .appic.wap{background:#25d366}
.hun-top .appic.wap svg{width:12px;height:12px}
.hun-row{display:flex;gap:10px;align-items:flex-start}
.hun-main{flex:1;min-width:0}
.hun-lg{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #e3e6ea;display:grid;place-items:center;margin-top:6px;flex:none}
/* web questions */
.qbar{height:5px;border-radius:3px;background:#eef1f6;overflow:hidden;margin:0 0 11px}
.qbar i{display:block;height:100%;background:#5B1F52;border-radius:3px}
.q-k{font-size:11px;font-weight:700;letter-spacing:.06em;color:#a8436a;text-transform:uppercase}
.fsf h3.q-t{margin:3px 0 12px;font-size:18px;line-height:1.3}
.qopt{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border:1.5px solid #d8dee8;border-radius:12px;margin-bottom:9px;font-size:15px;color:#111827;position:relative;overflow:hidden;cursor:pointer;background:#fff;line-height:1.3}
.qopt:hover{border-color:#aab6c8}
.qopt .radio{border-color:#9ca3af}
.qopt .radio.on{border-color:#B8446A}
.qopt .radio.on::after{background:#B8446A}
.qopt.hint{animation:qHint 1.6s ease-out infinite}
@keyframes qHint{0%{box-shadow:0 0 0 0 rgba(91,31,82,.3)}100%{box-shadow:0 0 0 8px rgba(91,31,82,0)}}
.qopt small{display:block;font-size:11.8px;color:#6b7280;margin-top:1px}
.q-n{font-size:11.5px;color:#6b7280;line-height:1.45;margin-top:4px}
.q-done{text-align:center;padding:10px 4px 14px}
.q-done .big,.ws-ok .big{width:58px;height:58px;border-radius:50%;background:#16a34a;color:#fff;display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 0 0 7px #dcfce7}
.q-done .big svg,.ws-ok .big svg{width:32px;height:32px}
.q-done h3{margin:0 0 4px}
.q-done p{margin:0;font-size:13px;color:#4b5563;line-height:1.45}
/* address */
