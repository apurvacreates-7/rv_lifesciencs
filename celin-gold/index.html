function renderCDP(c, step) {
  const D = DEMOS[c.demo];
  const key = val(step.subject, c);
  const S = SUBJECTS[key];
  const all = D.writes(c).map((w, i) => Object.assign({ i }, w));
  const mine = all.filter(w => w.subj === key && vis(w, c) && !(w.ty === 'pending' && w.s !== c.s));
  const fresh = mine.filter(w => isNew(w, c) && !w.hist);
  const base = c.cdpBase || val(step.cdpDelay, c) || 700;
  let n = 0;
  const delayOf = new Map(fresh.map(w => [w.i, base + (w.delay || 0) + (n++) * 240]));

  const pv = x => (typeof x === 'function' ? x(mine, c) : x);
  const head = `
    <div class="cdp-h"><span class="live-dot"></span><h2>What RV learns</h2>
      <span class="src">${ic('database')}Freestand CDP</span></div>
    <div class="cdp-p">
      <div class="cdp-av" style="background:${pv(S.bg)}">${pv(S.av)}</div>
      <div style="min-width:0;flex:1"><div class="cdp-pn">${pv(S.name)}</div><div class="cdp-pm">${pv(S.meta)}</div>
        <div class="cdp-badges">${(S.badges ? S.badges(mine, c) : []).join('')}</div></div>
    </div>
    ${S.stats ? `<div class="cdp-stats">${S.stats(mine, c).map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>` : ''}`;

  // newest first, grouped by date
  const rows = mine.slice().sort((a, b) => b.i - a.i);
  let html = '', lastD = null;
  for (const w of rows) {
    if (w.d !== lastD) { html += `<div class="fd-date">${dShort(w.d)}</div>`; lastD = w.d; }
    const d = delayOf.get(w.i);
    const vHtml = w.dist ? distHTML(w.dist) : `<div class="wv">${w.v}</div>`;
    html += `<div class="w ${w.ty === 'pending' ? 'pending' : ''}"${d !== undefined ? rv(d, 'new') : ''}>
      <span class="wt t-${w.ty}">${TYPE_LABEL[w.ty]}</span>
      <div class="wk"><span>${w.k}</span><span class="ts">${w.ty === 'pending' ? '<i class="spin"></i>' : (w.t ? w.t + ' IST' : '')}</span></div>
      ${vHtml}
      <div class="wmeta">${srcChip(w.src)}${w.note ? `<span class="tiny muted">${w.note}</span>` : ''}</div>
    </div>`;
  }
  if (!rows.length) html = S.empty || '';
  $('#cdp').innerHTML = head + `<div class="cdp-feed" id="cdpFeed">${html}</div>`;
}
function distHTML(dist) {
  const pal = dist.colors || ['#3a63c9', '#c96a1b', '#3aa17e', '#94a3b8'];  // validated categorical slots
  return `<div class="wv">${dist.title || ''}</div><div class="dist">${dist.parts.map((p, i) => `<i style="width:${p[1]}%;background:${pal[i]}" title="${p[0]} ${p[1]}%"></i>`).join('')}</div>
    <div class="dist-l">${dist.parts.map((p, i) => `<span><i style="background:${pal[i]}"></i>${p[0]} <b>${p[1]}%</b></span>`).join('')}</div>`;
}

/* ---------- step bar ---------- */
function renderStepbar(c, step, stepChange) {
  const D = DEMOS[c.demo];
  const total = D.steps.length;
  const nb = beatsOf(step, c);
  const cap = val(step.cap, c);
  const card = $('#sbCard');
  card.innerHTML = `
    <span class="step-chip">Step ${c.s + 1}</span>
    <div class="sb-txt"><div class="sb-t">${cap.t}</div><div class="sb-c">${cap.d}</div></div>
    ${nb > 1 ? `<div class="beats" title="Beat ${c.b + 1} of ${nb}">${Array.from({ length: nb }, (_, i) => `<i class="${i < c.b ? 'done' : i === c.b ? 'cur' : ''}"></i>`).join('')}</div>` : ''}`;
  if (stepChange) { card.classList.remove('swap'); void card.offsetWidth; card.classList.add('swap'); }
  $('#progLbl').innerHTML = `Step ${c.s + 1} of ${total}`;
  $('#segs').innerHTML = D.steps.map((s, i) => `<button class="${i < c.s ? 'done' : i === c.s ? 'cur' : ''}" data-act="jump:${i}" title="Step ${i + 1} · ${esc(val(s.cap, ctx({ s: i, b: 0 })).t)}" aria-label="Go to step ${i + 1}"></button>`).join('');
  $('#btnBack').disabled = c.s === 0 && c.b === 0;
  const last = c.s === total - 1 && c.b === nb - 1;
  $('#btnNext').innerHTML = last ? `${DEMOS[ST.demo === 'd2c' ? 'doc' : 'd2c'].nextLabel} ${ic('arrowR')}` : `Next ${ic('arrowR')}`;
  $('#btnNext').classList.toggle('nudge', !!val(step.nudge, c));
}

/* ---------- render ---------- */
let lastRenderKey = '';
function render(opts = {}) {
  Sched.clear();
  const c = ctx({ anim: !!opts.anim, dir: opts.dir || 0 });
  const step = stepOf(c.demo, c.s);
  const nav = val(step.nav, c);
  const navChanged = nav !== lastNav;
  setNav(nav);
  renderHead(val(step.head, c), opts.stepChange, navChanged);
  const stage = $('#stage');
  const layoutKey = c.demo + ':' + c.s + ':' + (val(step.layoutKey, c) || '');
  const enter = opts.stepChange || layoutKey !== lastRenderKey;
  stage.innerHTML = `<div class="st ${enter ? (c.dir < 0 ? 'enter-back' : 'enter') : ''}">${step.view(c)}</div>`;
  lastRenderKey = layoutKey;
  renderCDP(c, step);
  renderStepbar(c, step, opts.stepChange);
  fitAll();
  if (step.after) step.after(stage, c);
  $$('.wa-scroll, .call-body').forEach(sc => { sc.scrollTop = sc.scrollHeight; });
  runReveals(document);
  const feed = $('#cdpFeed'); if (feed) feed.scrollTop = 0;
  try { history.replaceState(null, '', `#${ST.demo}-${c.s + 1}`); } catch (e) {}
}
function readHash() {
  const m = /^#(d2c|doc)-(\d{1,2})$/.exec(location.hash || '');
  if (!m) return;
  const s = Math.min(Math.max(+m[2] - 1, 0), DEMOS[m[1]].steps.length - 1);
  ST.demo = m[1];
  ST.pos[m[1]] = { s, b: 0 };
}
function runReveals(root) {
  $$('[data-rv]', root).forEach(el => {
    el.classList.add('rv-hide');
    Sched.add(() => {
      el.classList.remove('rv-hide');
      el.classList.add(el.dataset.rvc || 'anim');
      const sc = el.closest('.wa-scroll, .call-body');
      if (sc) sc.scrollTop = sc.scrollHeight;
    }, +el.dataset.rv);
  });
  $$('[data-rvhide]', root).forEach(el => { Sched.add(() => { el.style.display = 'none'; }, +el.dataset.rvhide); });
  $$('[data-typing]', root).forEach(el => {
    const orig = el.innerHTML;
    el.dataset.typing.split(',').forEach(w => {
      const [a, b] = w.split('-').map(Number);
      Sched.add(() => { el.innerHTML = '<span class="typing">typing…</span>'; }, a);
      Sched.add(() => { el.innerHTML = orig; }, b);
    });
  });
}

/* ---------- fit phones + canvases to the stage ---------- */
const PHONE_W = 364, PHONE_H = 748;
function fitAll() {
  $$('.phone-slot').forEach(slot => {
    const col = slot.parentElement;
    const H = innerWidth <= 640 ? Math.min(innerHeight * 0.82, 700) : (col.clientHeight || 640);
    const k = Math.max(0.5, Math.min(1.08, (H - 6) / PHONE_H));
    slot.style.width = PHONE_W * k + 'px';
    slot.style.height = PHONE_H * k + 'px';
    slot.firstElementChild.style.transform = `scale(${k})`;
  });
  $$('.fit-box').forEach(box => {
    const inner = box.firstElementChild;
    if (inner.dataset.focus && inner.dataset.drawn) { inner.style.transition = 'none'; focusCanvas(inner, false); return; }
    const cw = +inner.dataset.w, ch = +inner.dataset.h;
    const W = box.clientWidth, H = box.clientHeight;
    const k = Math.min(W / cw, H / ch, 1.25);
    inner.style.transform = `translate(${(W - cw * k) / 2}px,${(H - ch * k) / 2}px) scale(${k})`;
  });
}
let rz = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(fitAll); });

/* ---------- command palette (⌘K) ---------- */
function openCmdk() {
  const bg = $('#cmdk');
  bg.classList.add('on');
  const inp = $('#cmdkIn');
  inp.value = '';
  drawCmdk('');
  setTimeout(() => inp.focus(), 10);
}
function closeCmdk() { $('#cmdk').classList.remove('on'); }
let cmdkSel = 0, cmdkItems = [];
function drawCmdk(q) {
  q = q.trim().toLowerCase();
  const items = [];
  for (const d of ['d2c', 'doc']) {
    DEMOS[d].steps.forEach((st, i) => {
      const cx = b => Object.assign(ctx({ s: i, b }), { demo: d, v: k => (ST.ch[d][k] ?? DEMOS[d].defaults[k]) });
      const cap = val(st.cap, cx(0));
      const nav = NAV_LABEL[val(st.nav, cx(0))] || ['', ''];
      const nb = Math.max(1, val(st.beats || 1, cx(0)));
      let text = `${nav[1]} ${DEMOS[d].title}`;
      for (let b = 0; b < nb; b++) { const cb = val(st.cap, cx(b)); const h = val(st.head, cx(b)); text += ` ${cb.t} ${cb.d} ${h.title}`; }
      text = text.toLowerCase();
      if (!q || q.split(/\s+/).every(t => text.includes(t))) items.push({ d, i, t: cap.t, g: DEMOS[d].title, nav: nav[1], icon: DEMOS[d].icon });
    });
  }
  cmdkItems = items;
  cmdkSel = Math.min(cmdkSel, Math.max(0, items.length - 1));
  let html = '', lastG = '';
  items.forEach((it, k) => {
    if (it.g !== lastG) { html += `<div class="cmdk-g">${it.g}</div>`; lastG = it.g; }
    html += `<div class="cmdk-it ${k === cmdkSel ? 'on' : ''}" data-k="${k}">${ic(it.icon)}<span>${esc(it.t)}</span><span class="muted tiny">· ${it.nav}</span><span class="n">Step ${it.i + 1}</span></div>`;
  });
  $('#cmdkList').innerHTML = html || '<div class="cmdk-g">No matches</div>';
}
function pickCmdk(k) {
  const it = cmdkItems[k];
  if (!it) return;
  closeCmdk();
  if (it.d !== ST.demo) { ST.demo = it.d; $$('.prog-toggle button').forEach(bt => bt.classList.toggle('on', bt.dataset.demo === it.d)); }
  ST.pos[it.d] = { s: it.i, b: 0 };
  render({ stepChange: true, anim: true, dir: 1 });
}

/* ---------- global events ---------- */
let busy = false;
function bindEvents() {
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (t && !t.disabled) {
      if (busy) return;
      ripple(t, e);
      if (t.closest('.phone, .scene')) {           // let the tap register visually before the screen moves on
        busy = true;
        setTimeout(() => { busy = false; doAct(t.dataset.act, t); }, 170);
      } else doAct(t.dataset.act, t);
      return;
    }
    const ck = e.target.closest('.cmdk-it');
    if (ck) return pickCmdk(+ck.dataset.k);
    if (e.target.id === 'cmdk') closeCmdk();
  });
  $('#btnNext').addEventListener('click', () => next());
  $('#btnBack').addEventListener('click', () => back());
  $$('.prog-toggle button').forEach(bt => bt.addEventListener('click', () => switchDemo(bt.dataset.demo, false)));
  $('#search').addEventListener('click', openCmdk);
  $('#cmdkIn').addEventListener('input', e => { cmdkSel = 0; drawCmdk(e.target.value); });
  document.addEventListener('keydown', e => {
    const open = $('#cmdk').classList.contains('on');
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); open ? closeCmdk() : openCmdk(); return; }
    if (open) {
      if (e.key === 'Escape') closeCmdk();
      else if (e.key === 'ArrowDown') { e.preventDefault(); cmdkSel = Math.min(cmdkSel + 1, cmdkItems.length - 1); drawCmdk($('#cmdkIn').value); scrollCmdk(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); cmdkSel = Math.max(cmdkSel - 1, 0); drawCmdk($('#cmdkIn').value); scrollCmdk(); }
      else if (e.key === 'Enter') { e.preventDefault(); pickCmdk(cmdkSel); }
      return;
    }
    if (e.target.closest('input,textarea')) return;
    if (busy) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); back(); }
  });
  // hover tooltips for chart marks
  const tip = $('#tip');
  document.addEventListener('mousemove', e => {
    const m = e.target.closest('[data-tip]');
    if (!m) { tip.classList.remove('on'); return; }
    tip.innerHTML = m.dataset.tip;
    tip.classList.add('on');
    const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + 'px';
    tip.style.top = e.clientY + 16 + 'px';
  });
}
function scrollCmdk() { const on = $('.cmdk-it.on'); if (on) on.scrollIntoView({ block: 'nearest' }); }

function waContact(o = {}) {

/* Render a WhatsApp chat. o = {c, thread, contact, input, overlay, hint} */
function waScreen(o) {
  const c = o.c;
  const items = o.thread.filter(m => vis(m, c));
  const today = o.today || [...items].reverse().find(m => m.d)?.d;
  let html = '<div class="spacer"></div>', prevWho = null, prevDate = null;
  let t = 120; const typing = [];
  const hintAct = o.hint;
  items.forEach(m => {
    const fresh = isNew(m, c);
    let delay = null;
    if (fresh) {
      if (m.ty === 'out') { delay = m.dl ?? t; t = delay + 380; }
      else if (m.ty === 'in') { const tw = m.fast ? 350 : 850; typing.push(`${t}-${t + tw}`); delay = m.dl ?? t + tw; t = delay + 520; }
      else { delay = t; t += 150; }
    }
    if (m.d && m.d !== prevDate) {
      html += `<div class="wa-date"${fresh ? rv(delay - 10) : ''}>${waDate(m.d, today)}</div>`;
      prevDate = m.d; prevWho = null;
    }
    if (m.ty === 'sys') { html += `<div class="wa-sys">${gl('lockF')}${m.text}</div>`; prevWho = null; return; }
    if (m.ty === 'biz') { html += `<div class="wa-biz"><span class="wa-biz-av">${rvMark(46)}</span><b>RV Life Sciences <svg viewBox="0 0 24 24">${G.verified}</svg></b><span>Health &amp; wellness · Business account</span><p>${m.text}</p></div>`; prevWho = null; return; }
    const first = prevWho !== m.ty;
    prevWho = m.ty;
    html += waMsg(m, c, first, fresh ? delay : null, hintAct);
  });
  const ct = waContact(o.contact);
  const inp = o.input;
  let field, sendBtn;
  if (inp && inp.text) {
    const live = inp.live ? ` data-act="${inp.act || 'next'}"` : '';
    const typedRv = inp.fresh && c.anim ? rv(t + 100, 'x') : '';
    field = `<div class="wa-field"><svg viewBox="0 0 24 24">${G.emoji}</svg><span class="ph"${typedRv ? ` data-rvhide="${t + 100}"` : ' style="display:none"'}>Message</span><span class="typed"${typedRv}>${esc(inp.text)}</span><svg viewBox="0 0 24 24">${G.clip}</svg></div>`;

  } else {
    field = `<div class="wa-field"><svg viewBox="0 0 24 24">${G.emoji}</svg><span class="ph">Message</span><svg viewBox="0 0 24 24">${G.clip}</svg><svg viewBox="0 0 24 24">${G.camera}</svg></div>`;
    sendBtn = `<div class="wa-send"><svg viewBox="0 0 24 24">${G.micF}</svg></div>`;
  }

    <div class="wa-head">
      <span class="hb"><svg viewBox="0 0 24 24">${G.back}</svg></span>

        <div class="wa-sub"${typing.length ? ` data-typing="${typing.join(',')}"` : ''}>${ct.sub}</div></div>
      <span class="hb"><svg viewBox="0 0 24 24">${G.videoCall}</svg></span>
      <span class="hb"><svg viewBox="0 0 24 24">${G.call}</svg></span>

}
function waMsg(m, c, first, delay, hintAct) {
  const live = m.s === c.s && m.b === c.b;

  if (m.hdr) inner += `<div class="hdr">${m.hdr}</div>`;
  if (m.text) inner += `<div class="tx">${m.text}${!m.ft ? meta : ''}</div>`;

/* ---------- camera scanning the pack QR ---------- */
function qrSVG(seed = 7, n = 25) {
  let x = seed * 9973 % 2147483647;
  const rnd = () => (x = x * 48271 % 2147483647) / 2147483647;
  const on = Array.from({ length: n }, () => Array(n).fill(0));
  for (let r = 0; r < n; r++) for (let cc = 0; cc < n; cc++) on[r][cc] = rnd() > 0.52 ? 1 : 0;
  const finder = (r0, c0) => { for (let r = -1; r < 8; r++) for (let cc = -1; cc < 8; cc++) { const rr = r0 + r, c2 = c0 + cc; if (rr < 0 || c2 < 0 || rr >= n || c2 >= n) continue; const edge = r === -1 || cc === -1 || r === 7 || cc === 7; const ring = r === 0 || cc === 0 || r === 6 || cc === 6; const core = r >= 2 && r <= 4 && cc >= 2 && cc <= 4; on[rr][c2] = edge ? 0 : (ring || core) ? 1 : 0; } };
  finder(0, 0); finder(0, n - 7); finder(n - 7, 0);
  for (let i = 8; i < n - 8; i++) { on[6][i] = i % 2 ? 0 : 1; on[i][6] = i % 2 ? 0 : 1; }
  for (let r = n - 9; r < n - 4; r++) for (let cc = n - 9; cc < n - 4; cc++) { const e = r === n - 9 || r === n - 5 || cc === n - 9 || cc === n - 5; on[r][cc] = e || (r === n - 7 && cc === n - 7) ? 1 : 0; }
  let d = '';
  for (let r = 0; r < n; r++) { let cc = 0; while (cc < n) { if (on[r][cc]) { let e = cc; while (e < n && on[r][e]) e++; d += `M${cc} ${r}h${e - cc}v1h-${e - cc}z`; cc = e; } else cc++; } }
  return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" shape-rendering="crispEdges"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="#fff"/><path d="${d}" fill="#111"/></svg>`;
}

/* =================================================================
   Scenes — flat vector illustration language (navy location bar,
   labelled role characters, navy-bordered speech bubbles)
   ================================================================= */
const SC = {
  navy: '#0B2E6E', orange: '#FF6B00', yellow: '#FFC20E', wall: '#E8EEF6', floor: '#D8DFE8', floorLine: '#C9D2DE',
  ink: '#13203b', shoe: '#1b1c21', pants: '#4a4e5a', hair: '#1d1b1c'
};
function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = pct / 100;
  const adj = v => Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f);
  r = adj(r); g = adj(g); b = adj(b);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
const tW = (s, fs) => s.length * fs * 0.53;

function sceneFrame(loc, inner, o = {}) {
  const locHtml = loc ? `<div class="loc-bar">${loc.split('·').map(x => x.trim()).join('<span class="dotsep">·</span>')}</div>` : '';
  return `<div class="scene ${o.cls || ''}">${locHtml}<svg class="scene-svg" viewBox="${o.vb || '0 0 1000 620'}" preserveAspectRatio="xMidYMid meet">${inner}</svg></div>`;
}
function bgPlane(h = 470, wall = SC.wall, floor = SC.floor, line = SC.floorLine) {

}

/* ---------- speech bubble (navy border, tail toward speaker) ---------- */
function bubble(x, y, lines, o = {}) {
  const fs = o.fs || 20, lh = o.lh || 27, px = 20, py = 15;
  const w = o.w || Math.ceil(Math.max(...lines.map(l => tW(l, fs)))) + px * 2;
  const h = lines.length * lh + py * 2 - (lh - fs) + 3;
  const tx = Math.min(Math.max(o.tx ?? x + 70, x + 28), x + w - 28);
  const r = 15, th = 18;
  const d = `M${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}H${tx + 11}L${tx} ${y + h + th}L${tx - 11} ${y + h}H${x + r}Q${x} ${y + h} ${x} ${y + h - r}V${y + r}Q${x} ${y} ${x + r} ${y}Z`;
  const txt = lines.map((l, i) => `<text x="${x + px}" y="${y + py + fs - 3 + i * lh}" font-size="${fs}" font-weight="700" fill="${SC.ink}">${esc(l)}</text>`).join('');
  const label = o.label ? `<text x="${x + px}" y="${y - 7}" font-size="12" font-weight="700" letter-spacing="1.5" fill="${SC.navy}">${o.label}</text>` : '';
  return `<g class="${o.cls || ''}" style="${o.style || ''}">${label}<path d="${d}" fill="#fff" stroke="${SC.navy}" stroke-width="3.5" stroke-linejoin="round"/>${txt}</g>`;
}

function person(o) {
  const x = o.x || 0, y = o.y || 470, s = o.s || 1;
  const skin = o.skin || '#c98b62', hair = o.hair || SC.hair, pants = o.pants || SC.pants, shoes = o.shoes || SC.shoe;

    }
    g += `<path d="M-41 0v-6a9 9 0 0 1 9-9h27v15z" fill="${shoes}"/><path d="M41 0v-6a9 9 0 0 0-9-9H5v15z" fill="${shoes}"/>`;

    g += `<path d="M-43 0v-6a9 9 0 0 1 9-9h27v15z" fill="${shoes}"/><path d="M43 0v-6a9 9 0 0 0-9-9H7v15z" fill="${shoes}"/>`;
  }
  // ---- back hair (long / ponytail)
  if (o.hairStyle === 'long') g += `<path d="M-29 ${headY - 4}C-31 ${headY - 40} 31 ${headY - 40} 29 ${headY - 4}L32 ${headY + 46}C24 ${headY + 52} 14 ${headY + 50} 12 ${headY + 40}L-12 ${headY + 40}C-14 ${headY + 50} -24 ${headY + 52} -32 ${headY + 46}Z" fill="${hair}"/>`;
  if (o.hairStyle === 'pony') g += `<path d="M18 ${headY - 16}C40 ${headY - 10} 44 ${headY + 22} 34 ${headY + 44}C30 ${headY + 30} 26 ${headY + 12} 14 ${headY - 2}Z" fill="${hair}"/>`;
  // ---- neck
  g += `<rect x="-8" y="${tTop - 15}" width="16" height="20" fill="${shade(skin, -12)}"/>`;
  // ---- torso
  const torso = c2 => `<path d="M${-tw} ${tBot}V${tTop + 22}Q${-tw} ${tTop} ${-tw + 22} ${tTop}H${tw - 22}Q${tw} ${tTop} ${tw} ${tTop + 22}V${tBot}Z" fill="${c2}"/>`;
  g += torso(shirt);
  if (coat) {
    g += `<path d="M${-tw - 2} ${tBot + 30}V${tTop + 22}Q${-tw - 2} ${tTop - 1} ${-tw + 20} ${tTop - 1}H-9L0 ${tTop + 44}L9 ${tTop - 1}H${tw - 20}Q${tw + 2} ${tTop - 1} ${tw + 2} ${tTop + 22}V${tBot + 30}Z" fill="${coat}"/>`;
    g += `<path d="M-9 ${tTop - 1}L-2 ${tTop + 40}M9 ${tTop - 1}L2 ${tTop + 40}" stroke="#d5dde8" stroke-width="2"/>`;
    g += `<line x1="0" y1="${tTop + 46}" x2="0" y2="${tBot + 28}" stroke="#d5dde8" stroke-width="2"/>`;
    g += `<rect x="12" y="${tTop + 40}" width="17" height="4" rx="1" fill="#d5dde8"/><rect x="16" y="${tTop + 30}" width="3" height="12" rx="1" fill="#2563eb"/><rect x="21" y="${tTop + 32}" width="3" height="10" rx="1" fill="#dc2626"/>`;
  }
  if (o.bib) {
    g += `<rect x="-22" y="${tTop + 50}" width="44" height="34" rx="3" fill="#fff" stroke="#d0d6de"/><text x="0" y="${tTop + 72}" text-anchor="middle" font-size="15" font-weight="900" fill="${SC.ink}">${o.bib}</text><text x="0" y="${tTop + 81}" text-anchor="middle" font-size="7" font-weight="700" fill="#ef4444" letter-spacing=".5">21K · DHM</text>`;
  }
  if (o.bag) g += `<path d="M${-tw + 4} ${tTop + 6}L${tw - 2} ${tBot - 8}" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>`;
  if (o.vest) g += `<rect x="${-tw}" y="${tTop + 62}" width="${tw * 2}" height="8" fill="${o.vest}" opacity=".9"/>`;

  if (o.label) {

  }
  // ---- arms (thick rounded strokes) + hands
  const arm = (side, pose) => {
    const sx = side * 44;
    let pts, hand;
    const A = (deg, len = 104) => { const r = deg * Math.PI / 180; return [sx + side * Math.sin(r) * len, shY + Math.cos(r) * len]; };

    else if (pose === 'forward') { const el = [side * 48, shY + 66]; hand = [side * 16, shY + 70]; pts = [[sx, shY], el, hand]; }

function wallClock(cx, cy, hh, mm, r = 26) {
  const ha = ((hh % 12) + mm / 60) * 30, ma = mm * 6;
  const hand = (a, l, w) => `<line x1="${cx}" y1="${cy}" x2="${cx + Math.sin(a * Math.PI / 180) * l}" y2="${cy - Math.cos(a * Math.PI / 180) * l}" stroke="${SC.ink}" stroke-width="${w}" stroke-linecap="round"/>`;
  let ticks = '';
  for (let i = 0; i < 12; i++) { const a = i * 30 * Math.PI / 180; ticks += `<line x1="${cx + Math.sin(a) * (r - 7)}" y1="${cy - Math.cos(a) * (r - 7)}" x2="${cx + Math.sin(a) * (r - 3)}" y2="${cy - Math.cos(a) * (r - 3)}" stroke="#94a3b8" stroke-width="2"/>`; }
  return `<g><circle cx="${cx}" cy="${cy}" r="${r + 3}" fill="${SC.navy}"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff"/>${ticks}${hand(ha, r * 0.5, 3.5)}${hand(ma, r * 0.75, 2.5)}<circle cx="${cx}" cy="${cy}" r="2.5" fill="${SC.orange}"/></g>`;
}

}

}
/* items: [{t,d,ts,at:[s,b]}] — status derived from current position */
function traceItems(list, c, runDelay) {
  return list.map(it => {
    const [s, b] = it.at;
    const reached = s < c.s || (s === c.s && b <= c.b);
    const isCur = s === c.s && b === c.b;
    const nextIdx = list.find(x => { const [s2, b2] = x.at; return !(s2 < c.s || (s2 === c.s && b2 <= c.b)); });
    let st = reached ? 'done' : (nextIdx === it ? (it.wait ? 'wait' : 'run') : 'todo');
    return Object.assign({}, it, { st, rv: isCur && c.anim ? (runDelay ?? c.phoneEnd ?? 600) : null, ts: reached ? it.ts : (st === 'run' || st === 'wait' ? (it.pend || '') : '') });
  });
}

function drawEdges(root, animate) {
  const canvas = $('.mf-canvas', root);
  if (!canvas) return;
  const edges = JSON.parse($('.mf', root).dataset.edges);
  const pos = el => { let x = 0, y = 0, e = el; while (e && e !== canvas) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return [x + el.offsetWidth / 2, y + el.offsetHeight / 2]; };
  const H = id => $(`[data-h="${id}"]`, canvas);
  let paths = '', labels = '';
  edges.forEach(([a, b, lbl]) => {
    const A = H(a), B = H(b);
    if (!A || !B) return;
    const [x1, y1] = pos(A), [x2, y2] = pos(B);
    const dx = Math.max(40, Math.abs(x2 - x1) * 0.5);
    paths += `<path class="e ${animate ? 'flow' : ''}" d="M${x1} ${y1}C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}"/>`;
    if (lbl) labels += `<span class="mf-elabel" style="left:${(x1 + x2) / 2}px;top:${(y1 + y2) / 2}px">${lbl}</span>`;
  });
  $('.mf-edges', canvas).innerHTML = paths;
  $('.mf-labels', canvas).innerHTML = labels;
  focusCanvas(canvas, animate);
  canvas.dataset.drawn = '1';
}
function focusCanvas(canvas, animate) {
  if (canvas.dataset.focus) {
    const box = canvas.parentElement;
    const nd = $('#nd-' + canvas.dataset.focus, canvas);
    const W = box.clientWidth, Hh = box.clientHeight;
    const fx = nd.offsetLeft - 70, fy = nd.offsetTop - 150, fw = nd.offsetWidth + 110, fh = nd.offsetHeight + 190;
    const k = Math.min(W / fw, Hh / fh, 1.2);
    const tx = (W - fw * k) / 2 - fx * k, ty = (Hh - fh * k) / 2 - fy * k;
    const target = `translate(${tx}px,${ty}px) scale(${k})`;
    if (animate) {
      canvas.style.transition = 'none';
      requestAnimationFrame(() => requestAnimationFrame(() => { canvas.style.transition = 'transform .9s cubic-bezier(.3,.7,.2,1)'; canvas.style.transform = target; }));
    } else canvas.style.transform = target;
  }
}

          fields: [{ l: 'Clinic / hospital', v: 'City Hospital · OPD Wing' }, { l: 'Room', v: 'OPD 14' }, { l: 'Address', v: 'Sector 3, Rohini' }, { l: 'PIN code', v: '110085' }, { l: 'City, state', v: 'Delhi, Delhi', lock: true }, { l: 'Best time to deliver', v: '10 AM – 2 PM (OPD hours)', sel: true }]
        }) : null;
        return phoneLayout(phoneFrame(waScreen({ c, thread: th, overlay }), { time: timeOf(th, c, '10:30') }), mehraTrace(c));
      }
    },
    { // 4 · AI call
      nav: 'conversations', subject: 'siddiqui', beats: 4, cdpDelay: 1200,
      cap: c => [
        { t: 'No reply in 48 hours? The AI assistant calls', d: 'Dr. Siddiqui never opened the invite, so the call lands between OPD sessions.' },
        { t: 'Introduces the kit, confirms interest', d: 'It speaks for RV Life Sciences and records verbal consent.' },
        { t: 'Captures the address by voice', d: 'Parsed into a structured address, with a confidence score.' },
        { t: 'Reads it back and confirms', d: 'Address written to the CDP with source = AI call; kit ordered.' }
      ][c.b],
      head: { crumb: ['Operate', 'Conversations'], title: 'Dr. Farhan Siddiqui', chips: [chip('AI voice call', 'violet', 'bot'), chip('Attempt 1 of 3', 'outline')], right: `<span class="ph-meta">${ic('clock')}16 Oct, 2:10 PM IST</span><button class="btn sm">${ic('mic')}Recording</button>` },
      view: c => `<div class="lay-vsplit">${sceneClinicCall(c)}${callStrip(c)}</div>`
    },
    { // 5 · Fulfilment
      nav: 'fulfilment', subject: 'network', cdpDelay: 700,
      cap: { t: '8,000 kits, dispatched by city', d: 'Batches ship from three Freestand hubs; every kit and patient pack is tracked.' },
      head: { crumb: ['Operate', 'Fulfilment'], title: 'Doctor experience kits', chips: [chip('8,000 kits', 'navy', 'package'), chip('10 city batches', 'outline')], right: `<span class="ph-meta">${ic('refresh')}As of 20 Oct, 10:15 AM IST</span><button class="btn sm">${ic('download')}Export</button>` },
      view: c => fulfilPage(c)
    },
    { // 6 · Kit delivered
      nav: 'field', subject: 'mehra', cdpDelay: 1300,
      cap: { t: 'Kit delivered to the clinic', d: 'The courier hands the Celin Gold experience kit to Dr. Mehra in the OPD wing.' },
      head: OPD_HEAD([chip('Delivered', 'green', 'check'), chip('20 Oct, 12:24 PM', 'outline', 'clock')]),
      view: c => `<div class="lay-scene">${sceneOPD(c, 6)}</div>`
    },
    { // 7 · Doctor opens kit
      nav: 'field', subject: 'mehra', cdpDelay: 1200,
      cap: { t: 'Doctor opens the kit', d: 'Twenty serialised packs carry her referral code; she scans the insert to confirm.' },
      head: OPD_HEAD([chip('Kit activated', 'green', 'qr'), chip('20 patient packs', 'outline', 'package')]),
      view: c => `<div class="lay-scene">${sceneOPD(c, 7)}</div>`
    },
    { // 8 · Patient
      nav: 'field', subject: 'mehra', cdpDelay: 1400,
      cap: { t: 'Doctor recommends and hands over the sample', d: 'The handover is offline; the pack’s QR will link this patient to Dr. Mehra.' },
      head: OPD_HEAD([chip('Patient handover', 'violet', 'users'), chip('Pack CG-DM-0147', 'outline', 'qr')]),
      view: c => `<div class="lay-scene">${sceneOPD(c, 8)}</div>`
    },
    { // 9 · Patient phone → People page
      nav: c => (c.b >= 7 + pcOff(c) ? 'people' : 'conversations'), subject: c => (c.b >= 7 + pcOff(c) ? 'mehra' : 'suresh'),
      beats: c => 8 + pcOff(c), layoutKey: c => (c.b >= 7 + pcOff(c) ? 'people' : 'phone'),
      cdpDelay: c => (c.b >= 7 + pcOff(c) ? 700 : undefined),
      cap: c => {
        const o = pcOff(c), b = c.b;
        if (b === 0) return { t: 'Patient scans the pack at home', d: 'The QR on the pack opens WhatsApp with its serial and Dr. Mehra’s code.' };
        if (b === 1) return { t: 'WhatsApp opens, message ready', d: 'One tap to send. The referral travels with the message.' };
        if (b === 2) return { t: 'Consent first, again', d: 'Same notice, same standard as the D2C journey.' };
        if (o && b === 3) return { t: 'A “not now” is respected', d: 'Nothing is sent until he says yes.' };
        if (b >= 3 + o && b <= 5 + o) return { t: 'The same three sincere questions', d: `Question ${b - 2 - o} of 3 · answers become traits on his profile.` };
        if (b === 6 + o) return { t: 'Linked: “Referred by Dr. Mehra”', d: 'His profile now carries the doctor who recommended the pack.' };
        return { t: 'The doctor’s profile updates', d: 'Dr. Mehra now shows 14 patients activated, each one consented.' };
      },
      head: c => (c.b >= 7 + pcOff(c)
        ? { crumb: ['Consumers', 'People'], title: 'Dr. Kavita Mehra', chips: [chip('Doctor', 'navy', 'stetho'), chip('Patients activated: 14', 'green', 'users')], right: `<span class="ph-meta">${ic('clock')}29 Oct, 7:49 PM IST</span><button class="btn sm">${ic('upload')}Export</button>` }
        : { crumb: ['Operate', 'Conversations'], title: 'Suresh Bansal', chips: [chip('WhatsApp', 'wag'), chip('Referred by Dr. Mehra', 'violet', 'stetho')], right: `<span class="ph-meta">${ic('qr')}Entry: pack QR · CG-DM-0147</span>` }),
      view: c => {
        const o = pcOff(c);
        if (c.b >= 7 + o) return peopleDoctor(c);
        if (c.b === 0) return phoneLayout(phoneFrame(camScreen(true), { dark: true, time: '7:47' }), patientTrace(c));
        const th = sureshThread(c);
        const input = c.b === 1 ? { text: 'Hi, I got Celin Gold from Dr. Mehra’s clinic. Code DM-7Q4K-0147', live: true, fresh: false } : null;
        return phoneLayout(phoneFrame(waScreen({ c, thread: th, input, contact: {} }), { time: timeOf(th, c, '7:48') }), patientTrace(c));
      }
    },
    { // 10 · Doctor re-engagement
      nav: 'conversations', subject: 'mehra', beats: 4,
      cap: c => [
        { t: 'Monthly doctor re-engagement', d: 'A short update with the numbers that matter, and one tap to restock.' },
        { t: 'Restock in one tap, then a feedback question', d: 'Packs are dispatched automatically to OPD 14.' },
        { t: 'Feedback on patient response', d: 'Doctor-reported, stored as a trait. No health claims asked or made.' },
        { t: 'Webinar invite', d: 'Registration lands in her profile and in RV’s medical-affairs calendar.' }
      ][c.b],
      head: MEHRA_HEAD([chip('Monthly digest', 'outline', 'calendar')]),
      view: c => {
        const th = mehraThread(c);
        return phoneLayout(phoneFrame(waScreen({ c, thread: th }), { time: timeOf(th, c, '1:15') }), doctorSummary(c));
      }
    },
    { // 11 · Analytics
      nav: 'analytics', subject: 'results', cdpDelay: 500,
      cap: { t: 'Results: doctors to patients to repurchase', d: 'WhatsApp and AI-call sign-ups side by side; every patient traced to a doctor.' },
      head: { crumb: ['Measure', 'Analytics'], title: 'Doctor network activation', chips: [chip('Live', 'green')], right: `<span class="ph-meta">${ic('refresh')}Updated 15 Dec, 6:00 PM IST</span><button class="btn sm">${ic('share')}Share</button>` },
      view: c => `<div class="lay-page">
        ${filtersRow([['calendar', '12 Oct – 15 Dec 2026'], ['pin', 'All India', '· 68 cities'], ['stetho', 'All specialties']])}
        ${kpiRow([{ l: 'Programme cost', v: '₹33.9 L', d: 'Kits ₹31.9 L · calls and messages ₹2.0 L' }, { l: 'Cost per activated patient', v: '₹87', d: '38,940 patients activated' }, { l: 'Doctor sign-up rate', v: '81.9%', d: '6,318 of 7,718 invited' }, { l: 'Patient repurchase', v: '19.0%', d: '7,410 of 38,940' }])}
        <div class="an-grid">
          ${funnelCard({
            title: 'Doctor-to-patient funnel', sub: 'Doctor bars share of invited · patient bars share of activated',
            legend: '<span><i style="background:#3a63c9"></i>Signed up on WhatsApp</span><span><i style="background:#a063e8"></i>Signed up by AI call</span>',
            rows: [
              { div: 'Doctors' },
              { n: 'Doctors invited', sub: 'WhatsApp 7,412 · voice only 306', v: 7718, bar: 100 },
              { n: 'Signed up', sub: 'WhatsApp 4,286 · AI call 2,032', v: 6318, pct: '81.9%', pctLbl: 'of invited', split: [{ w: 55.5, v: 4286, pct: '67.8% of sign-ups', label: 'WhatsApp' }, { w: 26.3, v: 2032, pct: '32.2% of sign-ups', label: 'AI call', color: '#a063e8' }] },
              { n: 'Kits delivered', sub: '3 hubs · 68 cities', v: 6204, bar: 80.4, pct: '98.2%', pctLbl: 'of signed up' },
              { div: 'Patients' },
              { n: 'Patients activated', sub: 'pack QR scanned + consented', v: 38940, bar: 100, pct: '6.3', pctLbl: 'per kit' },
              { n: 'Repurchase', sub: 'within 45 days', v: 7410, bar: 19.0, pct: '19.0%', pctLbl: 'of activated' }
            ]
          })}
          ${insightsCard([
            { icon: 'bot', html: '<b>AI calls signed up 2,032 doctors who never replied on WhatsApp</b>: 32% of all sign-ups, at ₹41 per sign-up.' },
            { icon: 'video', html: '<b>Webinar attendees activated 2.1× more patients</b> (9.4 vs 4.5 per kit). Invite high-potential doctors early.' },
            { icon: 'trend', html: '<b>Doctor-referred patients repurchase at 19.0%</b>, 1.4× the D2C sampling rate of 13.7%.' }
          ])}
        </div></div>`
    }
  ];

  DEMOS.doc = {
    title: 'Doctor network activation', nextLabel: 'Doctor network demo', short: 'Offline experience · WhatsApp-run', icon: 'stetho', steps, writes,
    defaults: { inv: 'yes', pc: 'agree', pq1: 'No', pq2: 'Energy', pq3: 'Me', restock: 'yes', fb: 'Mostly positive', web: 'yes' }
  };
})();

/* =================================================================
   Shell + boot
   ================================================================= */
function buildShell() {
  document.body.insertAdjacentHTML('afterbegin', `
  <div class="app">
    <header class="topbar">
      <div class="tb-brand">${FS_LOGO_FULL}${FS_LOGO_MARK}</div>
      <div class="ws" title="Switch workspace"><span class="ws-badge">${rvMark(24)}</span><div><div class="ws-name">RV Life Sciences</div><div class="ws-sub">Enterprise workspace</div></div>${ic('updown')}</div>
      <div class="prog"><div class="prog-toggle" role="tablist" aria-label="Programme">
        <button role="tab" data-demo="d2c">${ic('megaphone')}<span class="pt-txt">Celin Gold · Delhi pollution season</span><span class="pt-sub">D2C sampling</span></button>
        <button role="tab" data-demo="doc">${ic('stetho')}<span class="pt-txt">Doctor network activation</span><span class="pt-sub">Offline × WhatsApp</span></button>
      </div></div>
      <div class="tb-right">
        <div class="search" id="search" role="button" tabindex="0">${ic('search')}<span>Search people, flows, orders…</span><kbd>⌘K</kbd></div>
        <button class="tb-icon" aria-label="Help">${ic('help')}</button>
        <button class="tb-icon" aria-label="Notifications">${ic('bell')}<span class="dot"></span></button>
        <span class="avatar" title="Neha Kapoor">NK</span>
      </div>
    </header>
    <nav class="sidebar"><div class="sb-scroll" id="sbScroll"></div>
      <div class="sb-foot"><span class="avatar">NK</span><div class="u"><div class="u-n">Neha Kapoor</div><div class="u-r">Brand Manager · RV</div></div>${ic('updown')}</div></nav>
    <main class="main">
      <div class="page-head" id="pageHead"></div>
      <div class="workspace"><section class="stage" id="stage"></section><aside class="cdp" id="cdp" aria-live="polite"></aside></div>
      <footer class="stepbar"><div class="sb-card" id="sbCard"></div>
        <div class="sb-nav">
          <div class="prog-wrap"><div class="prog-lbl" id="progLbl"></div><div class="segs" id="segs"></div></div>
          <span class="kbd-hint"><kbd>←</kbd><kbd>→</kbd></span>
          <button class="nav-btn" id="btnBack">${ic('arrowL')}Back</button>
          <button class="nav-btn next" id="btnNext">Next ${ic('arrowR')}</button>
        </div></footer>
    </main>
  </div>
  <div class="cmdk-bg" id="cmdk"><div class="cmdk"><div class="cmdk-in">${ic('search')}<input id="cmdkIn" placeholder="Jump to a step, page or person…" autocomplete="off" spellcheck="false"><kbd style="background:#f1f4f8;color:var(--muted);border-color:var(--line)">esc</kbd></div><div class="cmdk-l" id="cmdkList"></div></div></div>
  <div class="tip" id="tip"></div>`);
}
(function boot() {
  buildShell();
  renderSidebar();
  bindEvents();
  readHash();
  $$('.prog-toggle button').forEach(bt => bt.classList.toggle('on', bt.dataset.demo === ST.demo));
  render({ stepChange: true, anim: true, dir: 1 });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitAll());
})();

</script>
</body>
</html>
